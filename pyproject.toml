[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keyswitch"
version = "0.1.0"
description = "Automatic keyboard layout correction for Ubuntu X11"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Oleg Shevchuk", email = "sh.oleg@list.ru"}]

[project.scripts]
keyswitch = "keyswitch.app:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
keyswitch = ["resources/*"]
