[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keyswitch"
version = "0.63.0"
description = "Local EN/RU keyboard layout correction for Windows, Linux X11 and macOS"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Oleg Shevchuk", email = "sh.oleg@list.ru"}]

[project.scripts]
keyswitch = "keyswitch.launcher:main"

[project.optional-dependencies]
windows = [
    "comtypes==1.4.17",
    "Pillow==13.0.0",
    "pystray==0.19.5",
]
typing = [
    "mypy==2.4.0",
    "PyGObject-stubs==2.17.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
keyswitch = ["py.typed", "resources/*", "resources/models/*"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests", "tools"]
mypy_path = "typings"
strict = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_unimported = true
extra_checks = true
warn_unreachable = true
warn_unused_configs = true
show_error_codes = true
pretty = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "unused-awaitable",
]

[[tool.mypy.overrides]]
# The input of a Wayland session (evdev, uinput, poll()) exists on Linux only. The Windows check leaves
# these modules out of its files and reads them where they are imported without reporting their errors;
# the Linux check lists and checks them in full.
module = ["keyswitch.wayland_native", "keyswitch.wayland_helper"]
follow_imports = "silent"
