[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "logcourier"
version = "0.1.0"
description = "Personal tray-based log collector with Telegram delivery"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["PySide6==6.11.2", "keyring==25.7.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-cov>=7,<8", "ruff>=0.12,<1", "pyinstaller==6.22.2"]

[project.scripts]
logcourier = "logcourier.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
