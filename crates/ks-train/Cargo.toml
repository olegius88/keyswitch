[package]
name = "ks-train"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ks-train"
path = "src/main.rs"

[[bin]]
name = "ks-release"
path = "src/bin/ks-release.rs"

[dependencies]
ks-cast.workspace = true
ks-text.workspace = true
ks-backend.workspace = true
ks-config.workspace = true
ks-lang.workspace = true
ks-context.workspace = true
ks-engine.workspace = true
ks-hunspell.workspace = true
ks-replay.workspace = true
indexmap.workspace = true
serde_json.workspace = true
sha2.workspace = true
flate2.workspace = true
# The captured question files are xz (liblzma, built in, as they are written with the preset that made them), the Tatoeba
# exports bz2 and the RPM indexes zstd.
xz2 = { version = "0.1", features = ["static"] }
regex = "1"
bzip2-rs = "0.1"
ruzstd = "0.8"
sha1 = "0.10"
num-bigint = "0.4"
md-5 = "0.10"

[dev-dependencies]
flate2.workspace = true

[lints]
workspace = true
