[package]
name = "ks-mac"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ks_mac"
path = "src/lib.rs"

[[bin]]
name = "KeySwitch"
path = "src/main.rs"

# Drives TextEdit from its own main thread, and says itself when it has nothing to drive.
[[test]]
name = "e2e_mac"
harness = false

[dependencies]
ks-cast.workspace = true
ks-backend.workspace = true
ks-config.workspace = true
ks-text.workspace = true
ks-lang.workspace = true
ks-context.workspace = true
ks-engine.workspace = true
ks-ui = { path = "../ks-ui" }
serde_json.workspace = true

# AppKit has no C interface: objc2 sends the messages. Everything else (CoreGraphics, Carbon, Accessibility, CoreFoundation)
# is plain `extern "C"`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[lints]
workspace = true
