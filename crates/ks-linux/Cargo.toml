[package]
name = "ks-linux"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ks_linux"
path = "src/lib.rs"

[[bin]]
name = "keyswitch"
path = "src/main.rs"

[dependencies]
ks-backend.workspace = true
ks-config.workspace = true
ks-text.workspace = true
ks-lang.workspace = true
ks-context.workspace = true
ks-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
# X11 protocol in pure Rust: no libX11, libXtst or libxkbcommon at run time.
x11rb = { version = "0.13", default-features = false, features = ["record", "xtest", "xkb"] }
# The accessibility bus, through the blocking API.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
ks-hunspell.workspace = true
libc = "0.2"
# The windows: GTK 4 and libadwaita, as the Python's PyGObject windows are. `gdk4-x11` gives the X11 id of a surface.
gtk = { package = "gtk4", version = "0.11" }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
gdk-x11 = { package = "gdk4-x11", version = "0.11" }
# Unix signals in the main loop, and the desktop entries of installed applications (both moved out of glib and gio).
glib-unix = "0.22"
gio-unix = "0.22"
ks-updates = { path = "../ks-updates" }
