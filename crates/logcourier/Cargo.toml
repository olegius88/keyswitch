[package]
name = "logcourier"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[lib]
name = "logcourier"
path = "src/lib.rs"

[[bin]]
name = "logcourier"
path = "src/main.rs"

[dependencies]
ks-text.workspace = true
serde_json.workspace = true
sha2.workspace = true
flate2.workspace = true
sqlite = { version = "0.41.1", package = "rusqlite", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Storage_FileSystem"] }
