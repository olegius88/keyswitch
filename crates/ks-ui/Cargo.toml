[package]
name = "ks-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ks_ui"
path = "src/lib.rs"

[dependencies]
ks-cast.workspace = true
ks-config.workspace = true
ks-text.workspace = true
ks-context.workspace = true
ks-engine.workspace = true
ks-updates = { path = "../ks-updates" }
serde.workspace = true
# raw_value: hints.json keeps what a newer version wrote as the JSON text it read.
serde_json = { workspace = true, features = ["raw_value"] }

[dev-dependencies]
ks-backend.workspace = true

[lints]
workspace = true
