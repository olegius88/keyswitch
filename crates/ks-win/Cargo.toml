[package]
name = "ks-win"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ks_win"
path = "src/lib.rs"

[[bin]]
name = "KeySwitch"
path = "src/main.rs"

# Drives real windows from its own main thread, and says itself when it has nothing to drive.
[[test]]
name = "e2e_windows"
harness = false

[dependencies]
ks-backend.workspace = true
ks-config.workspace = true
ks-text.workspace = true
ks-lang.workspace = true
ks-context.workspace = true
ks-engine.workspace = true
ks-ui = { path = "../ks-ui" }
ks-updates = { path = "../ks-updates" }
serde_json.workspace = true

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[dev-dependencies]
# The sequences dumped from the Python are gz-compressed JSON lines.
flate2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
