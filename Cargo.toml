[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.70.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/olegius88/keyswitch"

[workspace.dependencies]
ks-cast = { path = "crates/ks-cast" }
ks-backend = { path = "crates/ks-backend" }
ks-text = { path = "crates/ks-text" }
ks-config = { path = "crates/ks-config" }
ks-lang = { path = "crates/ks-lang" }
ks-context = { path = "crates/ks-context" }
ks-engine = { path = "crates/ks-engine" }
ks-hunspell = { path = "crates/ks-hunspell" }
ks-replay = { path = "crates/ks-replay" }
# float_roundtrip: Python parses a JSON number to the nearest double, and serde_json by default may not.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
indexmap = "2"
unicode-normalization = "0.1"
sha2 = "0.10"
miniz_oxide = "0.8"
flate2 = "1"
windows-sys = "0.61"

# The strictest rules the compiler and Clippy have. What is left out is about documents and size, not about types.
[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "warn"
unsafe_op_in_unsafe_fn = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
unused_import_braces = "warn"
non_ascii_idents = "warn"
unreachable_pub = "warn"
explicit_outlives_requirements = "warn"
meta_variable_misuse = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)", "cfg(coverage_nightly)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
similar_names = "allow"
too_many_arguments = "allow"
many_single_char_names = "allow"
items_after_statements = "allow"
format_push_string = "allow"
format_collect = "allow"
struct_field_names = "allow"
type_complexity = "allow"
unused_self = "allow"
needless_pass_by_value = "allow"
assert_is_empty = "allow"
match_same_arms = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"
comparison_chain = "allow"
doc_markdown = "allow"
# Numbers change type only through ks-cast, which says what happens to a value that does not fit.
as_conversions = "warn"
# A value that may be missing is handled, or `expect` says why it cannot be: the type system's version of Python's `assert x is not None`.
unwrap_used = "warn"
get_unwrap = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
# A byte offset inside a Cyrillic letter stops the program.
string_slice = "warn"
# A new variant must be looked at wherever the type is matched.
wildcard_enum_match_arm = "warn"
# Exceptions name their reason, and stop compiling when they stop being needed.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
fn_to_numeric_cast_any = "warn"
mem_forget = "warn"
rc_mutex = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
try_err = "warn"
unneeded_field_pattern = "warn"
dbg_macro = "warn"

# Size is what this port is for: the smallest code that is still fast enough for one keystroke at a time.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Parity runs replay tens of thousands of words: the same code, optimised, with its checks left on.
[profile.parity]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "unwind"
strip = false
debug-assertions = true
overflow-checks = true

# What the coverage run measures: the tests and the replays at a speed they finish, with the checks of `parity`. No link-time
# optimisation: it only costs time here.
[profile.coverage]
inherits = "parity"
opt-level = 2
lto = "off"

# A fit reads millions of frames: the same code, as fast as it goes, and every float the same as under `parity`.
[profile.train]
inherits = "parity"
debug-assertions = false
overflow-checks = false
