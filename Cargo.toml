[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.71.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/olegius88/keyswitch"

[workspace.dependencies]
ks-cast = { path = "crates/ks-cast" }
ks-backend = { path = "crates/ks-backend" }
ks-text = { path = "crates/ks-text" }
ks-config = { path = "crates/ks-config" }
ks-lang = { path = "crates/ks-lang" }
ks-context = { path = "crates/ks-context" }
ks-engine = { path = "crates/ks-engine" }
ks-hunspell = { path = "crates/ks-hunspell" }
ks-replay = { path = "crates/ks-replay" }
# float_roundtrip: Python parses a JSON number to the nearest double, and serde_json by default may not.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
indexmap = "2"
unicode-normalization = "0.1"
sha2 = "0.10"
miniz_oxide = "0.8"
flate2 = "1"
windows-sys = "0.61"

# The strictest rules the compiler and Clippy have, all of them stopping the build. What Clippy's pedantic group has beyond
# these and is switched off below is about documents, size and style, not about types. Indexing stays allowed: it is a check
# at run time, as it is in Python. An `expect` states why a value cannot be missing, as an `assert` does there.
[workspace.lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused_qualifications = "deny"
unused_lifetimes = "deny"
unused_import_braces = "deny"
non_ascii_idents = "deny"
unreachable_pub = "deny"
explicit_outlives_requirements = "deny"
meta_variable_misuse = "deny"
# A temporary `expect` stops compiling the day it is no longer needed.
unfulfilled_lint_expectations = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(coverage)", "cfg(coverage_nightly)"] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
similar_names = "allow"
too_many_arguments = "allow"
many_single_char_names = "allow"
items_after_statements = "allow"
format_push_string = "allow"
format_collect = "allow"
struct_field_names = "allow"
type_complexity = "allow"
unused_self = "allow"
needless_pass_by_value = "allow"
assert_is_empty = "allow"
match_same_arms = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"
comparison_chain = "allow"
manual_let_else = "allow"
doc_markdown = "allow"
# Numbers change type only through ks-cast, which says what happens to a value that does not fit.
as_conversions = "deny"
# A value that may be missing is handled, or `expect` says why it cannot be: the type system's version of Python's `assert x is not None`.
unwrap_used = "deny"
get_unwrap = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# A byte offset inside a Cyrillic letter stops the program.
string_slice = "deny"
# A new variant must be looked at wherever the type is matched.
wildcard_enum_match_arm = "deny"
# Exceptions name their reason, and stop compiling when they stop being needed.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
fn_to_numeric_cast_any = "deny"
mem_forget = "deny"
rc_mutex = "deny"
float_cmp_const = "deny"
lossy_float_literal = "deny"
try_err = "deny"
unneeded_field_pattern = "deny"
dbg_macro = "deny"
# The untyped JSON tree, its macro and its accessors, and `Any`: the types, macros and methods listed in clippy.toml.
disallowed_types = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"

# Size is what this port is for: the smallest code that is still fast enough for one keystroke at a time.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true

# Parity runs replay tens of thousands of words: the same code, optimised, with its checks left on.
[profile.parity]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "unwind"
strip = false
debug-assertions = true
overflow-checks = true

# What the coverage run measures: the tests and the replays at a speed they finish, with the checks of `parity`. No link-time
# optimisation: it only costs time here.
[profile.coverage]
inherits = "parity"
opt-level = 2
lto = "off"

# A fit reads millions of frames: the same code, as fast as it goes, and every float the same as under `parity`.
[profile.train]
inherits = "parity"
debug-assertions = false
overflow-checks = false
