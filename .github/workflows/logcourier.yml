name: LogCourier Windows and Linux
"on":
  push:
    paths:
      - 'apps/logcourier/**'
      - '.github/workflows/logcourier.yml'
  pull_request:
    paths:
      - 'apps/logcourier/**'
      - '.github/workflows/logcourier.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: logcourier-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/logcourier
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=logcourier --cov-report=term-missing
      - run: python tools/build.py
      - run: python tools/verify_frozen.py
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: python tools/build_installer.py
      - name: Verify installation, upgrade and uninstall
        if: runner.os == 'Windows'
        run: python tools/verify_installer.py
      - uses: actions/upload-artifact@v7
        with:
          name: LogCourier-${{ runner.os }}
          path: |
            apps/logcourier/dist/*.zip
            apps/logcourier/dist/LogCourier-Setup-*-x64.exe
            apps/logcourier/dist/*.sha256
          if-no-files-found: error
