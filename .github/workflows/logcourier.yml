name: LogCourier Windows and Linux
run-name: "LogCourier — tests and packages (Windows + Linux) — ${{ github.ref_name }} — ${{ github.event_name }}"
"on":
  push:
    paths:
      - 'apps/logcourier/**'
      - '.github/workflows/logcourier.yml'
  pull_request:
    paths:
      - 'apps/logcourier/**'
      - '.github/workflows/logcourier.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: logcourier-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    # The packages are built on Python 3.14; the 3.15 entries run the checks and tests ahead of the switch,
    # on the release candidate setup-python serves until the final reaches its manifest.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025]
        python: ['3.14', '3.15']
    continue-on-error: ${{ matrix.python != '3.14' }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/logcourier
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: ${{ matrix.python != '3.14' }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=logcourier --cov-report=term-missing
      - if: matrix.python == '3.14'
        run: python tools/build.py
      - if: matrix.python == '3.14'
        run: python tools/verify_frozen.py
      - name: Build Windows installer
        if: runner.os == 'Windows' && matrix.python == '3.14'
        run: python tools/build_installer.py
      - name: Verify installation, upgrade and uninstall
        if: runner.os == 'Windows' && matrix.python == '3.14'
        run: python tools/verify_installer.py
      - if: matrix.python == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: LogCourier-${{ runner.os }}
          path: |
            apps/logcourier/dist/*.zip
            apps/logcourier/dist/LogCourier-Setup-*-x64.exe
            apps/logcourier/dist/*.sha256
          if-no-files-found: error
