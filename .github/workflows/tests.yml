name: Tests
run-name: "KeySwitch — tests (Windows + Linux + macOS) — ${{ github.ref_name }} — ${{ github.event_name }}"

"on":
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keyswitch-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typing, coverage, X11 and tray E2E
    runs-on: ubuntu-26.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install runtime and test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            at-spi2-core \
            build-essential \
            ccache \
            dbus-x11 \
            desktop-file-utils \
            file \
            gir1.2-adw-1 \
            gir1.2-atspi-2.0 \
            gir1.2-gtk-4.0 \
            hunspell-en-us \
            hunspell-ru \
            libglib2.0-bin \
            libhunspell-1.7-0 \
            libx11-6 \
            libxkbcommon0 \
            libxtst6 \
            lintian \
            onboard-data \
            patch \
            patchelf \
            python3-coverage \
            python3-dbus \
            python3-dev \
            python3-gi \
            python3-pip \
            x11-xkb-utils \
            xauth \
            xvfb

      - name: Install static typing tools
        run: ./tools/install-typing-tools.sh "$RUNNER_TEMP/keyswitch-typing"

      - name: Run maximum strict Python type checking
        env:
          KEYSWITCH_TYPING_ROOT: ${{ runner.temp }}/keyswitch-typing
        run: ./tools/typecheck.sh

      - name: Run unit and GTK interaction tests with 100% branch coverage
        run: >-
          ./tools/run-gui-test.sh --
          ./tests/run_coverage.sh

      - name: Run real X11 RECORD/XTEST end-to-end test
        run: |
          ./tools/run-gui-test.sh --noreset -- \
            bash -c 'setxkbmap -layout us,ru && GTK_A11Y=none PYTHONPATH=src python3 tests/e2e_x11.py'

      - name: Run native AT-SPI caret and password E2E
        run: ./tools/run-atspi-e2e.sh

      - name: Run real StatusNotifierItem and DBusMenu integration test
        run: dbus-run-session -- env PYTHONPATH=src python3 tests/e2e_tray_menu.py

  replays:
    name: Model evidence replays (context, ortho, boundary, prefix)
    runs-on: ubuntu-26.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install runtime and test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            at-spi2-core \
            build-essential \
            ccache \
            dbus-x11 \
            desktop-file-utils \
            file \
            gir1.2-adw-1 \
            gir1.2-atspi-2.0 \
            gir1.2-gtk-4.0 \
            hunspell-en-us \
            hunspell-ru \
            libglib2.0-bin \
            libhunspell-1.7-0 \
            libx11-6 \
            libxkbcommon0 \
            libxtst6 \
            lintian \
            onboard-data \
            patch \
            patchelf \
            python3-coverage \
            python3-dbus \
            python3-dev \
            python3-gi \
            python3-pip \
            x11-xkb-utils \
            xauth \
            xvfb

      # Replays recompute, from pinned inputs, verdicts that are a deterministic
      # function of those inputs. A marker saved after a successful replay, under a
      # key that names every input (the committed source, tools, tests and model
      # files, this workflow file, the Python, compiler, C library and dictionary
      # versions), lets an identical tree skip the recomputation.
      # Set the repository variable KEYSWITCH_CI_REPLAY_CACHE to "off" to replay
      # on every run again.
      - name: Fingerprint the replay environment
        id: inputs
        run: |
          python_version="$(python3 -c 'import sys; print(sys.version.replace(" ", "_"))')"
          packages="$(dpkg-query -W -f='${binary:Package}=${Version}\n' onboard-data hunspell-ru hunspell-en-us libhunspell-1.7-0 | tr '\n' ';')"
          # The context, boundary and prefix trainers compile tools/context_optimizer.c
          # with gcc against glibc and must reproduce their outputs byte for byte.
          toolchain="$(gcc --version | sed -n 1p);$(ldd --version | sed -n 1p)"
          echo "environment=$(printf '%s|%s|%s' "$python_version" "$packages" "$toolchain" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          # The tree is fingerprinted once, from the committed blobs: a replay leaves
          # __pycache__ and regenerated outputs behind, so hashing the working tree
          # again at save time would never produce the key the lookup asked for.
          # The workflow file is part of it, so a changed replay step replays again.
          echo "tree=$(git ls-files -s -- src/keyswitch tools tests model pyproject.toml .github/workflows/tests.yml | sha256sum | cut -c1-64)" >> "$GITHUB_OUTPUT"

      - name: Look up a verified context replay of this exact tree
        id: restore_context
        if: ${{ vars.KEYSWITCH_CI_REPLAY_CACHE != 'off' }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/replay-markers/context.ok
          key: replay-context-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.environment }}-${{ steps.inputs.outputs.tree }}
          lookup-only: true

      - name: Verify active contextual evidence and versioned replay
        if: ${{ steps.restore_context.outputs.cache-hit != 'true' }}
        run: PYTHONPATH=src python3 tools/verify_context_model.py --replay

      - name: Verify historical rejected context-v2 numeric evidence
        if: ${{ steps.restore_context.outputs.cache-hit != 'true' }}
        run: PYTHONPATH=src python3 tools/verify_context_v2.py --verify-frozen

      - name: Record the verified context replay for this tree
        if: ${{ vars.KEYSWITCH_CI_REPLAY_CACHE != 'off' && steps.restore_context.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p "$RUNNER_TEMP/replay-markers"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/replay-markers/context.ok"

      - name: Save the verified context replay marker
        if: ${{ vars.KEYSWITCH_CI_REPLAY_CACHE != 'off' && steps.restore_context.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/replay-markers/context.ok
          key: replay-context-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.environment }}-${{ steps.inputs.outputs.tree }}

      - name: Look up a verified ortho replay of this exact tree
        id: restore_ortho
        if: ${{ vars.KEYSWITCH_CI_REPLAY_CACHE != 'off' }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/replay-markers/ortho.ok
          key: replay-ortho-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.environment }}-${{ steps.inputs.outputs.tree }}
          lookup-only: true

      - name: Replay key-space orthotactic training and promotion guard
        if: ${{ steps.restore_ortho.outputs.cache-hit != 'true' }}
        run: |
          PYTHONPATH=src python3 tools/ortho_corpus.py
          KEYSWITCH_MODEL_PATH=model/intent_v1/sources KEYSWITCH_HUNSPELL_PATH=model/intent_v1/sources/hunspell PYTHONPATH=src python3 tools/ortho_known.py
          PYTHONPATH=src python3 tools/ortho_web_lexicon.py
          PYTHONPATH=src python3 tools/ortho_prose_lexicon.py
          PYTHONPATH=src python3 tools/train_ortho_model.py verify
          PYTHONPATH=src:tools python3 tools/ortho_independent.py
          PYTHONPATH=src:tools python3 tools/verify_ortho_model.py
          PYTHONPATH=src python3 tools/ortho_v2_corpus.py
          KEYSWITCH_MODEL_PATH=model/intent_v1/sources PYTHONPATH=src python3 tools/ortho_v2_known.py
          KEYSWITCH_MODEL_PATH=model/intent_v1/sources PYTHONPATH=src python3 tools/ortho_v2_verified.py
          PYTHONPATH=src python3 tools/train_ortho_v2.py verify
          PYTHONPATH=src:tools python3 tools/verify_ortho_v2.py

      - name: Record the verified ortho replay for this tree
        if: ${{ vars.KEYSWITCH_CI_REPLAY_CACHE != 'off' && steps.restore_ortho.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p "$RUNNER_TEMP/replay-markers"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/replay-markers/ortho.ok"

      - name: Save the verified ortho replay marker
        if: ${{ vars.KEYSWITCH_CI_REPLAY_CACHE != 'off' && steps.restore_ortho.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/replay-markers/ortho.ok
          key: replay-ortho-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.environment }}-${{ steps.inputs.outputs.tree }}

      - name: Look up a verified boundary replay of this exact tree
        id: restore_boundary
        if: ${{ vars.KEYSWITCH_CI_REPLAY_CACHE != 'off' }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/replay-markers/boundary.ok
          key: replay-boundary-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.environment }}-${{ steps.inputs.outputs.tree }}
          lookup-only: true

      - name: Replay boundary segmentation training and prevent rejected rollout
        if: ${{ steps.restore_boundary.outputs.cache-hit != 'true' }}
        run: |
          PYTHONPATH=src python3 tools/verify_boundary_model.py --verify-frozen
          PYTHONPATH=src python3 tools/evaluate_boundary_engine.py --verify

      - name: Verify frozen boundary-v2 numeric evidence and current engine gate
        if: ${{ steps.restore_boundary.outputs.cache-hit != 'true' }}
        run: |
          PYTHONPATH=src python3 tools/verify_boundary_v2.py --verify-frozen
          PYTHONPATH=src python3 tools/verify_boundary_v2.py

      - name: Record the verified boundary replay for this tree
        if: ${{ vars.KEYSWITCH_CI_REPLAY_CACHE != 'off' && steps.restore_boundary.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p "$RUNNER_TEMP/replay-markers"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/replay-markers/boundary.ok"

      - name: Save the verified boundary replay marker
        if: ${{ vars.KEYSWITCH_CI_REPLAY_CACHE != 'off' && steps.restore_boundary.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/replay-markers/boundary.ok
          key: replay-boundary-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.environment }}-${{ steps.inputs.outputs.tree }}

      - name: Look up a verified prefix replay of this exact tree
        id: restore_prefix
        if: ${{ vars.KEYSWITCH_CI_REPLAY_CACHE != 'off' }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/replay-markers/prefix.ok
          key: replay-prefix-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.environment }}-${{ steps.inputs.outputs.tree }}
          lookup-only: true

      - name: Verify frozen prefix numeric evidence and current engine replay
        if: ${{ steps.restore_prefix.outputs.cache-hit != 'true' }}
        run: |
          PYTHONPATH=src python3 tools/verify_prefix_model.py --verify-frozen
          PYTHONPATH=src python3 tools/evaluate_prefix_engine.py --verify
          PYTHONPATH=src python3 tools/verify_prefix_model.py

      - name: Record the verified prefix replay for this tree
        if: ${{ vars.KEYSWITCH_CI_REPLAY_CACHE != 'off' && steps.restore_prefix.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p "$RUNNER_TEMP/replay-markers"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/replay-markers/prefix.ok"

      - name: Save the verified prefix replay marker
        if: ${{ vars.KEYSWITCH_CI_REPLAY_CACHE != 'off' && steps.restore_prefix.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/replay-markers/prefix.ok
          key: replay-prefix-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.environment }}-${{ steps.inputs.outputs.tree }}

  intent:
    name: Detector and intent-model quality gates
    runs-on: ubuntu-26.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install runtime and test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            at-spi2-core \
            build-essential \
            ccache \
            dbus-x11 \
            desktop-file-utils \
            file \
            gir1.2-adw-1 \
            gir1.2-atspi-2.0 \
            gir1.2-gtk-4.0 \
            hunspell-en-us \
            hunspell-ru \
            libglib2.0-bin \
            libhunspell-1.7-0 \
            libx11-6 \
            libxkbcommon0 \
            libxtst6 \
            lintian \
            onboard-data \
            patch \
            patchelf \
            python3-coverage \
            python3-dbus \
            python3-dev \
            python3-gi \
            python3-pip \
            x11-xkb-utils \
            xauth \
            xvfb

      - name: Enforce detector quality gates
        run: >-
          PYTHONPATH=src tools/evaluate_detector.py
          --sample 10000 --dictionary-sample 10000 --strict

      - name: Enforce linear intent-model quality gates
        run: |
          (cd model/intent_v1/sources && sha256sum --check SHA256SUMS)
          mkdir -p build
          PYTHONPATH=src tools/evaluate_intent_model.py --strict \
            > build/keyswitch-intent-strict.json
          python3 tools/verify_intent_strict_report.py \
            --report build/keyswitch-intent-strict.json

      - name: Hand the strict report to the package job
        uses: actions/upload-artifact@v7
        with:
          name: keyswitch-intent-strict
          path: build/keyswitch-intent-strict.json
          if-no-files-found: error
          retention-days: 1

  package:
    name: Native Debian package
    runs-on: ubuntu-26.04
    needs: [intent]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install runtime and test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            at-spi2-core \
            build-essential \
            ccache \
            dbus-x11 \
            desktop-file-utils \
            file \
            gir1.2-adw-1 \
            gir1.2-atspi-2.0 \
            gir1.2-gtk-4.0 \
            hunspell-en-us \
            hunspell-ru \
            libglib2.0-bin \
            libhunspell-1.7-0 \
            libx11-6 \
            libxkbcommon0 \
            libxtst6 \
            lintian \
            onboard-data \
            patch \
            patchelf \
            python3-coverage \
            python3-dbus \
            python3-dev \
            python3-gi \
            python3-pip \
            x11-xkb-utils \
            xauth \
            xvfb

      - name: Install pinned native build tools
        run: ./tools/install-build-tools.sh "$RUNNER_TEMP/keyswitch-nuitka"

      # The report is verified against this tree before it is reused
      # (packaging/build-deb.sh runs tools/verify_intent_strict_report.py on it).
      - name: Take the strict report from the intent job
        uses: actions/download-artifact@v8
        with:
          name: keyswitch-intent-strict
          path: build

      # Nuitka keeps its compiler cache (ccache / clcache) and downloads under
      # NUITKA_CACHE_DIR; a cached object file is byte-identical to a recompiled
      # one, so the package is the same and only the C compilation is saved.
      - name: Point Nuitka at a cache that survives the job
        shell: bash
        run: echo "NUITKA_CACHE_DIR=$RUNNER_TEMP/nuitka-cache" >> "$GITHUB_ENV"

      - name: Restore the Nuitka compiler cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/nuitka-cache
          key: nuitka-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/keyswitch/**', 'packaging/**', 'tools/install-build-tools.sh') }}
          restore-keys: |
            nuitka-${{ runner.os }}-${{ runner.arch }}-

      - name: Build native Debian package
        env:
          KEYSWITCH_NUITKA_ROOT: ${{ runner.temp }}/keyswitch-nuitka
          KEYSWITCH_INTENT_STRICT_REPORT: build/keyswitch-intent-strict.json
        run: ./packaging/build-deb.sh

      - name: Validate native Debian package
        run: |
          package_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' pyproject.toml | head -n 1)"
          architecture="$(dpkg --print-architecture)"
          package="dist/keyswitch_${package_version}_${architecture}.deb"
          ./tools/verify-native-deb.sh "$package"
          desktop-file-validate packaging/io.github.olegius88.KeySwitch.desktop
          lintian --fail-on error "$package"

      - name: Run packaged native executable X11 and tray E2E
        run: |
          package_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' pyproject.toml | head -n 1)"
          architecture="$(dpkg --print-architecture)"
          package="dist/keyswitch_${package_version}_${architecture}.deb"
          ./tools/run-gui-test.sh --noreset -- \
            bash -c 'setxkbmap -layout us,ru && GTK_USE_PORTAL=0 ./tools/run-native-e2e.sh "$1"' \
            _ "$package"

  windows:
    name: Strict Win32 tests and native installer
    runs-on: windows-2025

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Point Nuitka at a cache that survives the job
        shell: bash
        run: echo "NUITKA_CACHE_DIR=$RUNNER_TEMP/nuitka-cache" >> "$GITHUB_ENV"

      - name: Restore the Nuitka compiler cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/nuitka-cache
          key: nuitka-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/keyswitch/**', 'packaging/**', 'tools/install-build-tools.sh') }}
          restore-keys: |
            nuitka-${{ runner.os }}-${{ runner.arch }}-

      - name: Install pinned typing, runtime and build dependencies
        run: |
          # pwsh reports only the last command's exit code; without this a
          # failing command earlier in the step would leave it green.
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install coverage==7.15.4 mypy==2.3.1 Nuitka==4.2 ordered-set==4.1.0 pystray==0.19.5 Pillow==12.3.0 comtypes==1.4.16
          python -m pip install --no-deps PyGObject-stubs==2.17.0

      - name: Configure the EN and RU keyboard layouts for the E2E
        shell: powershell
        run: |
          $languages = New-WinUserLanguageList -Language "en-US"
          $languages.Add("ru-RU")
          Set-WinUserLanguageList -LanguageList $languages -Force
          $configured = Get-WinUserLanguageList
          $inputMethods = @($configured | ForEach-Object { $_.InputMethodTips })
          if (-not ($inputMethods -contains "0409:00000409") -or -not ($inputMethods -contains "0419:00000419")) {
            throw "The Windows runner did not apply the EN/RU keyboard layouts"
          }

      - name: Run maximum strict Python type checking on Windows
        env:
          PYTHONPATH: src
        run: |
          # pwsh reports only the last command's exit code; without this a
          # failing command earlier in the step would leave it green.
          $PSNativeCommandUseErrorActionPreference = $true
          python -m mypy --config-file pyproject.toml --exclude "^tools/freeze_intent_development_corpus\.py$"
          python -m mypy --config-file pyproject.toml --platform linux tools/freeze_intent_development_corpus.py

      - name: Run Win32 unit tests with 100% branch coverage
        env:
          PYTHONPATH: src
          KEYSWITCH_MODEL_PATH: model/intent_v1/sources
        run: |
          # pwsh reports only the last command's exit code; without this a
          # failing command earlier in the step would leave it green.
          $PSNativeCommandUseErrorActionPreference = $true
          python -m coverage erase
          python -m coverage run --branch --source=src/keyswitch tests/test_intent_model.py -v
          python -m coverage run --append --branch --source=src/keyswitch -m unittest discover -s tests -p test_windows_backend.py -v
          python -m coverage run --append --branch --source=src/keyswitch -m unittest discover -s tests -p test_input_integrity.py -v
          python -m coverage run --append --branch --source=src/keyswitch -m unittest discover -s tests -p test_input_sequence_matrix.py -v
          python -m coverage run --append --branch --source=src/keyswitch -m unittest discover -s tests -p test_language_intent_regressions.py -v
          python -m coverage run --append --branch --source=src/keyswitch -m unittest discover -s tests -p test_word_decision.py -v
          python -m coverage run --append --branch --source=src/keyswitch -m unittest discover -s tests -p test_action_boundary.py -v
          python -m coverage run --append --branch --source=src/keyswitch -m unittest discover -s tests -p test_context*.py -v
          python -m coverage run --append --branch --source=src/keyswitch -m unittest discover -s tests -p test_boundary_model.py -v
          python -m coverage run --append --branch --source=src/keyswitch -m unittest discover -s tests -p test_boundary_policy.py -v
          python -m coverage run --append --branch --source=src/keyswitch -m unittest discover -s tests -p test_reader_recovery.py -v
          python -m coverage run --append --branch --source=src/keyswitch -m unittest discover -s tests -p test_prefix*.py -v
          python -m coverage run --append --branch --source=src/keyswitch -m unittest discover -s tests -p test_early_context.py -v
          python -m coverage run --append --branch --source=src/keyswitch tests/test_updates.py -v
          python -m coverage report --fail-under=100 --include="*/intent_model.py,*/updates.py,*/windows_app.py,*/windows_backend.py,*/windows_instance.py,*/windows_system.py,*/windows_tray.py,*/windows_ui_model.py"

      - name: Run bidirectional WH_KEYBOARD_LL, SendInput and Tk correction E2E
        timeout-minutes: 6
        shell: pwsh
        env:
          KEYSWITCH_MODEL_PATH: model/intent_v1/sources
          PYTHONPATH: src
        run: |
          python tests/e2e_windows.py
          if ($LASTEXITCODE -ne 0) {
            # The Tk window must confirm the engine's layout switch within the engine's window;
            # a starved runner misses it once. A second failure is real.
            Write-Host "::warning::Windows E2E failed once, running it a second time"
            python tests/e2e_windows.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build and self-diagnose native ZIP and Inno Setup installer
        shell: pwsh
        run: ./packaging/build-windows.ps1

      - name: Smoke-test a silent per-user installation
        # The step takes under a minute; a hung installer has held a runner for an
        # hour until GitHub lost it (0.36.2, a branch run of 04.10.2026).
        timeout-minutes: 15
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"$').Matches.Groups[1].Value
          $installer = "dist/KeySwitch-Setup-$version-x64.exe"
          $installRoot = Join-Path $env:RUNNER_TEMP "KeySwitch-installed"
          $install = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installRoot" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)" }
          $env:KEYSWITCH_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "KeySwitch-smoke-config"
          $env:KEYSWITCH_DATA_DIR = Join-Path $env:RUNNER_TEMP "KeySwitch-smoke-data"
          New-Item -ItemType Directory -Force $env:KEYSWITCH_CONFIG_DIR | Out-Null
          '{"general":{"autostart":false},"appearance":{"show_indicator":false},"updates":{"check_automatically":false}}' | Set-Content -Path (Join-Path $env:KEYSWITCH_CONFIG_DIR "config.json") -Encoding utf8NoBOM
          Remove-Item Env:KEYSWITCH_INTENT_MODEL_PATH -ErrorAction SilentlyContinue
          $installedExecutable = Join-Path $installRoot "KeySwitch.exe"
          $installedModel = Join-Path $installRoot "keyswitch\resources\models\layout_intent_v1.ksm"
          $sourceModel = "src/keyswitch/resources/models/layout_intent_v1.ksm"
          $intentManifest = "model/intent_v1/manifest.json"
          $diagnosticOutput = Join-Path $env:RUNNER_TEMP "KeySwitch-installed-diagnostics.json"
          $diagnosticError = Join-Path $env:RUNNER_TEMP "KeySwitch-installed-diagnostics.stderr.txt"
          $diagnosticProcess = Start-Process -FilePath $installedExecutable -ArgumentList "--diagnose" -RedirectStandardOutput $diagnosticOutput -RedirectStandardError $diagnosticError -PassThru
          if (-not $diagnosticProcess.WaitForExit(30000)) {
            $diagnosticProcess.Kill()
            $diagnosticProcess.WaitForExit()
            throw "Installed executable diagnostics timed out after 30 seconds"
          }
          if ($diagnosticProcess.ExitCode -notin @(0, 1)) { throw "Installed executable diagnostics exited with $($diagnosticProcess.ExitCode)" }
          if ((Get-Item -LiteralPath $diagnosticOutput).Length -gt 1MB) { throw "Installed executable diagnostics exceed 1 MiB" }
          if ((Get-Item -LiteralPath $intentManifest).Length -gt 1MB) { throw "Intent-model manifest exceeds 1 MiB" }
          $diagnostics = Get-Content -LiteralPath $diagnosticOutput -Raw -Encoding utf8 | ConvertFrom-Json
          $manifest = Get-Content -LiteralPath $intentManifest -Raw -Encoding utf8 | ConvertFrom-Json
          if ($diagnostics.intent_model.available -isnot [bool] -or -not $diagnostics.intent_model.available) { throw "Installed executable cannot load its bundled intent model" }
          if ($diagnostics.intent_model.checksum -cne (Get-FileHash -LiteralPath $sourceModel -Algorithm SHA256).Hash.ToLowerInvariant()) { throw "Installed executable loaded an unexpected intent-model checksum" }
          if ($diagnostics.intent_model.version -cne $manifest.artifact_model_version) { throw "Installed executable loaded an unexpected intent-model version" }
          $diagnosedModel = [System.IO.Path]::GetFullPath([string]$diagnostics.intent_model.path)
          $expectedInstalledModel = [System.IO.Path]::GetFullPath($installedModel)
          if (-not $diagnosedModel.Equals($expectedInstalledModel, [System.StringComparison]::OrdinalIgnoreCase)) { throw "Installed executable did not load its exact in-installation intent model" }
          $smoke = Start-Process -FilePath (Join-Path $installRoot "KeySwitch.exe") -ArgumentList "--smoke-ui" -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "Installed executable exited with $($smoke.ExitCode)" }
          $update = Start-Process -FilePath $installer -ArgumentList "/SP-", "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CLOSEAPPLICATIONS", "/NORESTARTAPPLICATIONS", "/KEYSWITCHUPDATE=1", "/DIR=$installRoot" -PassThru
          $update.WaitForExit()
          if ($update.ExitCode -ne 0) { throw "Auto-update installer exited with $($update.ExitCode)" }
          $keyswitchUpdatedProcess = $null
          for ($attempt = 0; $attempt -lt 40 -and -not $keyswitchUpdatedProcess; $attempt++) {
            Start-Sleep -Milliseconds 250
            $keyswitchUpdatedProcess = Get-Process -Name "KeySwitch" -ErrorAction SilentlyContinue |
              Where-Object { $_.Path -eq (Join-Path $installRoot "KeySwitch.exe") } |
              Select-Object -First 1
          }
          if (-not $keyswitchUpdatedProcess) { throw "Auto-update installer did not relaunch KeySwitch" }
          Stop-Process -Id $keyswitchUpdatedProcess.Id -Force
          Wait-Process -Id $keyswitchUpdatedProcess.Id -ErrorAction SilentlyContinue
          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          New-Item -Path $runKey -Force | Out-Null
          New-ItemProperty -Path $runKey -Name "KeySwitch" -Value (Join-Path $installRoot "KeySwitch.exe") -PropertyType String -Force | Out-Null
          $uninstaller = Get-ChildItem -Path $installRoot -Filter "unins*.exe" | Select-Object -First 1
          if (-not $uninstaller) { throw "The installed uninstaller is missing" }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with $($uninstall.ExitCode)" }
          if (Test-Path (Join-Path $installRoot "KeySwitch.exe")) { throw "Uninstaller left KeySwitch.exe behind" }
          $runProperties = Get-ItemProperty -Path $runKey
          if ($runProperties.PSObject.Properties.Name -contains "KeySwitch") { throw "Uninstaller left the KeySwitch autostart value behind" }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: keyswitch-windows-package
          path: |
            dist/KeySwitch-Setup-*-x64.exe
            dist/KeySwitch-*-windows-x64.zip
          if-no-files-found: error

  macos:
    name: Test and build the native macOS application
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    # Read here rather than inside the step: a step cannot test its own
    # environment in its condition, and a fork has no secrets at all.
    env:
      SIGNING_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      SIGNING_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Point Nuitka at a cache that survives the job
        shell: bash
        run: echo "NUITKA_CACHE_DIR=$RUNNER_TEMP/nuitka-cache" >> "$GITHUB_ENV"

      - name: Restore the Nuitka compiler cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/nuitka-cache
          key: nuitka-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/keyswitch/**', 'packaging/**', 'tools/install-build-tools.sh') }}
          restore-keys: |
            nuitka-${{ runner.os }}-${{ runner.arch }}-

      - name: Install pinned typing and build dependencies
        run: |
          python -m pip install coverage==7.15.4 mypy==2.3.1 Nuitka==4.2 ordered-set==4.1.0
          python -m pip install --no-deps PyGObject-stubs==2.17.0

      - name: Run strict type checking and the macOS unit tests
        env:
          PYTHONPATH: src
          KEYSWITCH_MODEL_PATH: model/intent_v1/sources
        run: |
          python -m mypy --config-file pyproject.toml \
            src/keyswitch/macos_app.py src/keyswitch/macos_backend.py \
            src/keyswitch/macos_context.py src/keyswitch/macos_native.py \
            src/keyswitch/macos_objc.py src/keyswitch/macos_services.py \
            src/keyswitch/macos_system.py src/keyswitch/macos_tray_native.py \
            src/keyswitch/desktop_ui.py src/keyswitch/desktop_services.py
          python -m coverage run --branch --source=src/keyswitch \
            -m unittest discover -s tests -p "test_macos_*.py" -v
          python -m coverage run --append --branch --source=src/keyswitch \
            -m unittest discover -s tests -p "test_tray_model.py" -v
          python -m coverage report --fail-under=100 \
            --include="*/macos_app.py,*/macos_backend.py,*/macos_context.py,*/macos_services.py,*/macos_system.py,*/tray_model.py,*/system_model.py"

      - name: Import the Developer ID signing identity
        if: ${{ env.SIGNING_CERTIFICATE != '' }}
        run: |
          keychain_password="$(openssl rand -base64 24)"
          printf '%s' "$SIGNING_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/identity.p12"
          security create-keychain -p "$keychain_password" build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          security unlock-keychain -p "$keychain_password" build.keychain
          security import "$RUNNER_TEMP/identity.p12" -k build.keychain \
            -P "$SIGNING_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" build.keychain >/dev/null
          security list-keychains -d user -s build.keychain \
            $(security list-keychains -d user | tr -d '" ')
          rm -f "$RUNNER_TEMP/identity.p12"
          identity="$(security find-identity -v -p codesigning build.keychain \
            | sed -nE 's/.*"(Developer ID Application: .*)"/\1/p' | head -n 1)"
          test -n "$identity"
          echo "KEYSWITCH_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "KEYSWITCH_SIGN_KEYCHAIN=build.keychain" >> "$GITHUB_ENV"

      - name: Build the application bundle
        run: packaging/build-macos.sh

      - name: Run the packaged application and read its diagnostics
        run: |
          bundle="dist/macos-native/KeySwitch.app/Contents/MacOS/keyswitch-bin"
          # A runner grants no Accessibility permission, so the keyboard is
          # unavailable and the report says so; what is proven here is that the
          # bundle starts at all and finds everything it carries. Signed builds
          # have hung at this exact point before, for want of an entitlement.
          set +e
          "$bundle" --diagnose > diagnostics.json 2>&1
          status=$?
          set -e
          cat diagnostics.json
          test "$status" -eq 0 -o "$status" -eq 1
          python - <<'PYTHON'
          import json
          import pathlib

          report = json.loads(pathlib.Path("diagnostics.json").read_text(encoding="utf-8"))
          assert report["session_type"] == "quartz", report["session_type"]
          assert report["intent_model"]["available"], report["intent_model"]
          assert report["context_model"]["available"], report["context_model"]
          bundled = pathlib.Path(report["intent_model"]["path"])
          assert "KeySwitch.app" in bundled.parts, bundled
          PYTHON

      - name: Verify the signature and its entitlements
        if: ${{ env.KEYSWITCH_SIGN_IDENTITY != '' }}
        run: |
          bundle="dist/macos-native/KeySwitch.app"
          codesign --verify --strict --deep --verbose=2 "$bundle"
          codesign -d --entitlements :- "$bundle" | tee entitlements.txt
          grep -q "com.apple.security.cs.allow-unsigned-executable-memory" entitlements.txt
          codesign -dv --verbose=4 "$bundle" 2>&1 | grep -q "Timestamp="

  windows-arm64-probe:
    # Not released yet: this job finds out whether the Win32 tests, the E2E and
    # the Nuitka/Inno Setup build work on native Windows ARM64. It never fails
    # the run; read its step results. The build script still names its output
    # x64 here and the files are not published.
    name: Probe the Win32 tests and build on Windows ARM64
    runs-on: windows-11-arm
    continue-on-error: true
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up native ARM64 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          architecture: arm64

      - name: Point Nuitka at a cache that survives the job
        shell: bash
        run: echo "NUITKA_CACHE_DIR=$RUNNER_TEMP/nuitka-cache" >> "$GITHUB_ENV"

      - name: Restore the Nuitka compiler cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/nuitka-cache
          key: nuitka-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/keyswitch/**', 'packaging/**', 'tools/install-build-tools.sh') }}
          restore-keys: |
            nuitka-${{ runner.os }}-${{ runner.arch }}-

      - name: Report the interpreter and toolchain
        run: |
          python -c "import platform, sys, sysconfig; print(platform.machine(), sys.version, sysconfig.get_platform())"
          Get-Command ISCC.exe -ErrorAction SilentlyContinue | Format-List Source
          Test-Path (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe")

      - name: Install pinned runtime and build dependencies
        continue-on-error: true
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install coverage==7.15.4 Nuitka==4.2 ordered-set==4.1.0 pystray==0.19.5 Pillow==12.3.0 comtypes==1.4.16

      - name: Configure the EN and RU keyboard layouts for the E2E
        continue-on-error: true
        shell: powershell
        run: |
          $languages = New-WinUserLanguageList -Language "en-US"
          $languages.Add("ru-RU")
          Set-WinUserLanguageList -LanguageList $languages -Force

      - name: Run the Win32 backend and input tests on ARM64
        continue-on-error: true
        env:
          PYTHONPATH: src
          KEYSWITCH_MODEL_PATH: model/intent_v1/sources
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m unittest discover -s tests -p test_windows_backend.py
          python -m unittest discover -s tests -p test_input_integrity.py
          python tests/test_intent_model.py

      - name: Clear the sign-in shell windows that hold the foreground
        continue-on-error: true
        shell: powershell
        run: |
          # The Windows 11 desktop image opens a WWAHost window (the host of Windows web
          # apps) at sign-in and, once that is closed, the search and Start surfaces hold
          # the foreground: the E2E window never came to the front ("did not become
          # foreground ... actual='wwahost'", then 'searchhost'). Close the web-app host,
          # dismiss the shell surfaces with Escape, and log the foreground on the way.
          Add-Type -Namespace KeySwitchCi -Name Foreground -MemberDefinition @'
          [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
          [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr window, out uint process);
          [DllImport("user32.dll")] public static extern void keybd_event(byte key, byte scan, uint flags, UIntPtr extra);
          '@
          function Get-ForegroundName {
            [uint32] $owner = 0
            [void] [KeySwitchCi.Foreground]::GetWindowThreadProcessId([KeySwitchCi.Foreground]::GetForegroundWindow(), [ref] $owner)
            (Get-Process -Id $owner -ErrorAction SilentlyContinue).ProcessName
          }
          Write-Output "Foreground before: $(Get-ForegroundName)"
          Get-CimInstance Win32_Process -Filter "Name = 'WWAHost.exe'" | Format-List ProcessId, CommandLine
          Get-Process WWAHost -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $shellSurfaces = @("WWAHost", "SearchHost", "SearchApp", "StartMenuExperienceHost", "ShellExperienceHost")
          foreach ($attempt in 1..5) {
            $name = Get-ForegroundName
            Write-Output "Foreground: $name"
            if ($shellSurfaces -notcontains $name) { break }
            [KeySwitchCi.Foreground]::keybd_event(0x1B, 0, 0, [UIntPtr]::Zero)
            [KeySwitchCi.Foreground]::keybd_event(0x1B, 0, 2, [UIntPtr]::Zero)
            Start-Sleep -Seconds 1
          }
          Write-Output "Foreground after: $(Get-ForegroundName)"

      - name: Run the hook, SendInput and Tk E2E on ARM64
        continue-on-error: true
        timeout-minutes: 5
        env:
          KEYSWITCH_MODEL_PATH: model/intent_v1/sources
          PYTHONPATH: src
        run: python tests/e2e_windows.py

      - name: Build the native distribution and installer on ARM64
        continue-on-error: true
        shell: pwsh
        run: ./packaging/build-windows.ps1

      - name: Check the ARM64 files the build produced
        continue-on-error: true
        shell: pwsh
        run: |
          # build-windows.ps1 names the files after the build Python's architecture and
          # refuses an executable whose PE machine is not ARM64.
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"$').Matches.Groups[1].Value
          foreach ($file in "dist/KeySwitch-Setup-$version-arm64.exe", "dist/KeySwitch-$version-windows-arm64.zip") {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "The ARM64 build did not produce $file" }
            Write-Host ("{0}: {1:N0} bytes" -f $file, (Get-Item -LiteralPath $file).Length)
          }
