name: CI and release

on:
  push:
    branches: [main, rust]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  tests:
    name: Tests (pure logic, every crate that needs no desktop)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      # The APT repository goes live before the release does: a tag that does not name the packaged version must stop here,
      # before installed systems are offered a rebuilt package under the old version. A candidate adds -rcN to the version.
      - name: The tag names the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n 1)"
          case "$GITHUB_REF_NAME" in
            "v$version" | "v$version"-rc[0-9]*) ;;
            *)
              printf 'Tag %s does not name the packaged version %s\n' "$GITHUB_REF_NAME" "$version" >&2
              exit 1
              ;;
          esac
      - name: Toolchain with the Windows target for type checks
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-pc-windows-msvc i686-pc-windows-msvc aarch64-pc-windows-msvc
      - name: Tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libhunspell-1.7-0 hunspell-en-us hunspell-ru
          cargo test -p ks-text -p ks-backend -p ks-config -p ks-lang -p ks-hunspell -p ks-context -p ks-engine -p ks-replay -p ks-updates -p ks-ui -p ks-win -p ks-train
      - name: The engine against the recorded traces
        run: cargo test --release -p ks-replay
      - name: The trainer, and the models it can rebuild from the files in the repository
        run: |
          cargo test --release -p ks-train
          cargo run --release -p ks-train --bin ks-train -- boundary --tree "$PWD" --verify
          cargo run --release -p ks-train --bin ks-train -- ortho --tree "$PWD" --verify
          cargo run --release -p ks-train --bin ks-train -- archive --tree "$PWD"
          cargo run --release -p ks-train --bin ks-train -- gates --tree "$PWD"
          cargo run --release -p ks-train --bin ks-train -- licenses --tree "$PWD" --verify
          for family in boundary-v1 context-v2 ortho-v2 prefix-v1; do
            cargo run --release -p ks-train --bin ks-train -- retired "$family" --tree "$PWD" --replay > /dev/null
          done
          cargo run --release -p ks-train --bin ks-train -- retired context-corpus --tree "$PWD" > /dev/null
          cargo run --release -p ks-train --bin ks-train -- ortho --tree "$PWD" --inputs
          cargo run --release -p ks-train --bin ks-train -- intent --tree "$PWD" --verify
          cargo run --release -p ks-train --bin ks-train -- intent --tree "$PWD" --preseal --output preseal.json
          cmp preseal.json model/intent_v1/holdout-v28-preseal.json
          cargo run --release -p ks-train --bin ks-train -- intent --tree "$PWD" --freeze --output development.json
          cmp development.json model/intent_v1/unknown-typo-development-v28.json
          cargo run --release -p ks-train --bin ks-train -- intent --tree "$PWD" --evaluate --strict --output strict.json
      - name: Windows code type-checks for every architecture
        run: |
          for target in x86_64-pc-windows-msvc i686-pc-windows-msvc aarch64-pc-windows-msvc; do
            cargo check -p ks-win --target "$target"
          done

  windows-installer:
    # Built and run on the architecture it is for: Windows on Arm on an Arm runner, x86 on the x64 image.
    name: Windows installer (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            architecture: x64
          - runner: windows-11-vs2026-arm
            architecture: arm64
          - runner: windows-2025
            architecture: x86
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Rust and Inno Setup
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add i686-pc-windows-msvc
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
      - name: Build
        shell: powershell
        run: packaging\build-rust.ps1 -OutputDirectory out -Architecture ${{ matrix.architecture }}
      - name: Install, start and quit, each within a time limit
        shell: pwsh
        run: |
          $setup = (Get-ChildItem out\KeySwitch-Setup-*.exe).FullName
          $run = {
            param($file, $arguments, $limit)
            $process = Start-Process -FilePath $file -ArgumentList $arguments -PassThru
            $null = $process.Handle
            if (-not $process.WaitForExit($limit)) { $process.Kill(); throw "$file $arguments did not finish in $limit ms" }
            if ($process.ExitCode -ne 0) { throw "$file $arguments exited with $($process.ExitCode)" }
          }
          & $run $setup @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") 300000
          $app = "$env:LOCALAPPDATA\Programs\KeySwitch\KeySwitch.exe"
          & $run $app @("--version") 60000
          & $run $app @("--smoke-ui") 120000
          "$((Get-Item $app).Length) bytes, setup $((Get-Item $setup).Length) bytes"
      - name: The portable archive starts from where it is unpacked
        shell: pwsh
        run: |
          $zip = (Get-ChildItem out\KeySwitch-*-windows-*.zip).FullName
          $folder = Join-Path $env:RUNNER_TEMP "keyswitch-portable"
          Expand-Archive -LiteralPath $zip -DestinationPath $folder
          $process = Start-Process -FilePath (Join-Path $folder "KeySwitch.exe") -ArgumentList "--version" -PassThru
          $null = $process.Handle
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw "the unpacked program did not answer --version" }
          if ($process.ExitCode -ne 0) { throw "the unpacked program exited with $($process.ExitCode)" }
      - name: The installed program against a real window
        timeout-minutes: 15
        shell: pwsh
        run: |
          # The Windows 11 Arm image opens the host of web apps at sign-in, and it holds the foreground.
          Get-Process WWAHost -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $list = New-WinUserLanguageList -Language "en-US"
          $list.Add("ru-RU")
          Set-WinUserLanguageList -LanguageList $list -Force
          $target = @{ x64 = "x86_64-pc-windows-msvc"; arm64 = "aarch64-pc-windows-msvc"; x86 = "i686-pc-windows-msvc" }["${{ matrix.architecture }}"]
          cargo test --release -p ks-win --test e2e_windows --target $target --no-run
          $env:KS_E2E_BINARY = "$env:LOCALAPPDATA\Programs\KeySwitch\KeySwitch.exe"
          cargo test --release -p ks-win --test e2e_windows --target $target
          if ($LASTEXITCODE -ne 0) {
            # The window must take the program's layout switch within the engine's window; a starved runner misses it once. A second failure is real.
            Write-Host "::warning::the Windows end-to-end test failed once, running it a second time"
            cargo test --release -p ks-win --test e2e_windows --target $target
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: keyswitch-release-windows-${{ matrix.architecture }}
          path: |
            out/KeySwitch-Setup-*.exe
            out/KeySwitch-*-windows-*.zip
          retention-days: 14

  deb:
    name: Debian package and the Linux program's tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain and GTK development files
        run: |
          rustup toolchain install stable --profile minimal
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev xvfb dbus
      - name: Tests
        run: cargo test -p ks-linux
      - name: Build
        run: packaging/build-rust-deb.sh out
      - name: What the package holds
        run: cargo run --release -p ks-train --bin ks-train -- deb-check --tree "$PWD" "$(ls out/keyswitch_*.deb)"
      - name: Install and start
        run: |
          sudo apt-get install -y ./out/keyswitch_*.deb
          keyswitch --version
          xvfb-run -a dbus-run-session -- keyswitch --diagnose | jq -e '.intent_model.available and .context_model.available and .prefix_model.available'
      - uses: actions/upload-artifact@v7
        with:
          name: keyswitch-release-deb
          path: out/keyswitch_*.deb
          retention-days: 14

  linux-e2e:
    # On the newer image: GTK 4.14 of the image the package is built on leaves a field made hidden at run time readable as
    # plain text over AT-SPI, which a password entry of any version is not.
    name: The real tests on Linux, and the package
    needs: deb
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain, GTK development files and what the tests drive
        run: |
          rustup toolchain install stable --profile minimal
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libhunspell-1.7-0 hunspell-en-us hunspell-ru xvfb dbus x11-xkb-utils at-spi2-core libglib2.0-bin
      - uses: actions/download-artifact@v7
        with:
          name: keyswitch-release-deb
          path: out
      - name: The real tests in a private X server, and the package itself
        run: packaging/e2e.sh "$(ls out/keyswitch_*.deb)"

  macos:
    name: macOS bundle, ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            architecture: arm64
          - runner: macos-26-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    # Read here rather than inside the step: a step cannot test its own environment in its condition.
    env:
      SIGNING_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      SIGNING_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Tests
        run: cargo test -p ks-mac
      - name: Import the Developer ID signing identity
        if: ${{ env.SIGNING_CERTIFICATE != '' }}
        run: |
          keychain_password="$(openssl rand -base64 24)"
          printf '%s' "$SIGNING_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/identity.p12"
          security create-keychain -p "$keychain_password" build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          security unlock-keychain -p "$keychain_password" build.keychain
          security import "$RUNNER_TEMP/identity.p12" -k build.keychain \
            -P "$SIGNING_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" build.keychain >/dev/null
          security list-keychains -d user -s build.keychain \
            $(security list-keychains -d user | tr -d '" ')
          rm -f "$RUNNER_TEMP/identity.p12"
          identity="$(security find-identity -v -p codesigning build.keychain \
            | sed -nE 's/.*"(Developer ID Application: .*)"/\1/p' | head -n 1)"
          test -n "$identity"
          echo "KEYSWITCH_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "KEYSWITCH_SIGN_KEYCHAIN=build.keychain" >> "$GITHUB_ENV"
      - name: Build the bundle
        run: packaging/build-rust-macos.sh dist
      - name: Run the bundle and read its diagnostics
        run: |
          # A runner grants no Accessibility permission, so the keyboard is unavailable and the report says so; what is
          # proven here is that the bundle starts and finds everything it carries.
          set +e
          dist/macos-native/KeySwitch.app/Contents/MacOS/KeySwitch --diagnose > diagnostics.json
          status=$?
          set -e
          cat diagnostics.json
          test "$status" -eq 0 -o "$status" -eq 1
          jq -e '.session_type == "quartz" and .intent_model.available and .context_model.available and .prefix_model.available and (.intent_model.path | contains("KeySwitch.app"))' diagnostics.json
      - name: Notarize the bundle and staple the ticket
        if: ${{ env.KEYSWITCH_SIGN_IDENTITY != '' && env.NOTARY_KEY != '' }}
        run: |
          bundle="dist/macos-native/KeySwitch.app"
          key="$RUNNER_TEMP/notary-key.p8"
          submission="$RUNNER_TEMP/KeySwitch-notarization.zip"
          trap 'rm -f "$key" "$submission"' EXIT
          printf '%s\n' "$NOTARY_KEY" > "$key"
          ditto -c -k --keepParent "$bundle" "$submission"
          xcrun notarytool submit "$submission" --key "$key" --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" --wait
          # Stapling fails when no accepted ticket exists, so a rejected submission stops the job here.
          xcrun stapler staple "$bundle"
          xcrun stapler validate "$bundle"
          spctl --assess --type execute --verbose=2 "$bundle"
          archive="$(find dist -maxdepth 1 -name 'KeySwitch-*-macos-*.zip' -print -quit)"
          test -n "$archive"
          rm -f "$archive"
          ditto -c -k --keepParent "$bundle" "$archive"
      - uses: actions/upload-artifact@v7
        with:
          name: keyswitch-release-macos-${{ matrix.architecture }}
          path: dist/KeySwitch-*-macos-*.zip
          retention-days: 14

  logcourier:
    name: LogCourier tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - name: GTK development files
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev
      - run: cargo test -p logcourier
      - run: cargo build --release -p logcourier
      - uses: actions/upload-artifact@v7
        with:
          name: logcourier-${{ matrix.os }}
          path: |
            target/release/logcourier
            target/release/logcourier.exe
          retention-days: 14

  apt-repository:
    # The repository is what keeps an installed Linux KeySwitch up to date, and every package carries the source pointing
    # at it, so it has to be live before the release that hands out that package. A candidate tag (-rcN) stays out of it.
    name: Publish the signed APT repository
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: [tests, windows-installer, deb, linux-e2e, macos, logcourier]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SIGNING_KEY: ${{ secrets.KEYSWITCH_APT_SIGNING_KEY }}
      SIGNING_PASSPHRASE: ${{ secrets.KEYSWITCH_APT_SIGNING_PASSPHRASE }}
      POOL_RELEASES: "5"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: keyswitch-release-deb
          path: dist
      - name: Read the GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v6
      - name: Pages publishes the URL the package trusts
        run: |
          published="${{ steps.pages.outputs.base_url }}/"
          trusted="$(sed -nE 's/^URIs:[[:space:]]+([^[:space:]]+)$/\1/p' packaging/debian/keyswitch.sources)"
          if [ "$published" != "$trusted" ]; then
            printf 'Pages serves %s while the package trusts %s\n' "$published" "$trusted" >&2
            exit 1
          fi
      - name: Keep the previously published packages installable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          current="keyswitch_${version}_amd64.deb"
          test -f "dist/$current"
          mkdir -p pool-history
          tags="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-pre-releases --limit "$POOL_RELEASES" --json tagName --jq '.[].tagName')"
          for tag in $tags; do
            asset="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '[.assets[].name | select(startswith("keyswitch_") and endswith("_amd64.deb"))] | first // empty')"
            if [ -z "$asset" ] || [ "$asset" = "$current" ]; then
              continue
            fi
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir pool-history
          done
          printf 'Kept %d earlier package(s) alongside %s\n' "$(find pool-history -name '*.deb' | wc -l)" "$current"
      - name: Import the repository signing key
        run: |
          if [ -z "$SIGNING_KEY" ] || [ -z "$SIGNING_PASSPHRASE" ]; then
            printf 'The repository signing secrets are missing: set %s and %s.\n' KEYSWITCH_APT_SIGNING_KEY KEYSWITCH_APT_SIGNING_PASSPHRASE >&2
            exit 1
          fi
          home="$RUNNER_TEMP/keyswitch-apt-gnupg"
          install -d -m 0700 "$home"
          printf '%s' "$SIGNING_KEY" | GNUPGHOME="$home" gpg --batch --import
          printf '%s' "$SIGNING_PASSPHRASE" > "$RUNNER_TEMP/keyswitch-apt-passphrase"
          chmod 0600 "$RUNNER_TEMP/keyswitch-apt-passphrase"
          echo "GNUPGHOME=$home" >> "$GITHUB_ENV"
      - run: rustup toolchain install stable --profile minimal
      - name: Build and sign the repository
        run: |
          arguments=()
          for package in dist/*.deb pool-history/*.deb; do
            if [ -e "$package" ]; then
              arguments+=(--package "$package")
            fi
          done
          cargo run --release -p ks-train --bin ks-train -- apt-build --tree "$PWD" --repository site "${arguments[@]}" \
            --passphrase-file "$RUNNER_TEMP/keyswitch-apt-passphrase"
      - name: Verify the repository the way an installed system reads it
        run: cargo run --release -p ks-train --bin ks-train -- apt-verify --tree "$PWD" --repository site --expect-version "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy the repository to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  publish:
    # A candidate tag (vX.Y.Z-rcN) becomes a pre-release: the update check of every installed program reads the latest
    # release, and a pre-release is never that. The plain tag vX.Y.Z replaces the published version for everybody.
    name: Publish the files of a tag
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v')
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    needs: [tests, windows-installer, deb, linux-e2e, macos, logcourier, apt-repository]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: keyswitch-release-*
          path: assets
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n 1)"
          (cd assets && sha256sum -- * > SHA256SUMS)
          flags=()
          case "$GITHUB_REF_NAME" in
            *-*) flags+=(--prerelease --latest=false) ;;
            *) flags+=(--latest) ;;
          esac
          gh release create "$GITHUB_REF_NAME" assets/* --verify-tag --title "KeySwitch ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md "${flags[@]}"
