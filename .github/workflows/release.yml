name: Build Linux, Windows and macOS packages and release
run-name: "KeySwitch — release build (Windows + Linux + macOS) — ${{ github.ref_name }}"

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Read-only by default: the build and test jobs install third-party packages and
# need no write access. Only the release job publishes, and asks for it there.
permissions:
  contents: read

concurrency:
  group: keyswitch-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The suite takes about 37 minutes of one core under coverage; two runners share it
  # (tools/run_test_modules.py --part), and the coverage job joins their data for the report.
  verify:
    name: Tests under coverage, part ${{ matrix.part }} of 2${{ matrix.part == 1 && '; typing, X11 and tray E2E' || '' }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      # The APT repository is deployed before the release job runs: a tag that
      # does not name the packaged version must stop the run here, before
      # installed systems are offered a rebuilt package under the old version.

      - name: Check that the tag names the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          package_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' pyproject.toml | head -n 1)"
          if [ "$GITHUB_REF_NAME" != "v$package_version" ]; then
            printf 'Tag %s does not name the packaged version %s\n' \
              "$GITHUB_REF_NAME" "$package_version" >&2
            exit 1
          fi

      - name: Install runtime, test and package validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            at-spi2-core \
            build-essential \
            ccache \
            dbus-x11 \
            desktop-file-utils \
            file \
            gir1.2-adw-1 \
            gir1.2-atspi-2.0 \
            gir1.2-gtk-4.0 \
            hunspell-en-us \
            hunspell-ru \
            libglib2.0-bin \
            libhunspell-1.7-0 \
            libx11-6 \
            libxkbcommon0 \
            libxtst6 \
            lintian \
            onboard-data \
            patch \
            patchelf \
            python3-coverage \
            python3-dbus \
            python3-dev \
            python3-gi \
            python3-pip \
            x11-xkb-utils \
            xauth \
            xvfb

      - name: Install static typing tools
        if: matrix.part == 1
        run: ./tools/install-typing-tools.sh "$RUNNER_TEMP/keyswitch-typing"

      - name: Run maximum strict Python type checking
        if: matrix.part == 1
        env:
          KEYSWITCH_TYPING_ROOT: ${{ runner.temp }}/keyswitch-typing
        run: ./tools/typecheck.sh

      - name: Install NumPy for the context-v3 trainer's back ends
        run: ./tools/install-training-accelerators.sh

      - name: Run this part of the unit and GTK interaction tests under branch coverage
        env:
          KEYSWITCH_TEST_PART: ${{ matrix.part }}/2
        run: >-
          ./tools/run-gui-test.sh --
          ./tests/run_coverage.sh

      - name: Hand this part's coverage data to the coverage job
        uses: actions/upload-artifact@v7
        with:
          name: keyswitch-coverage-part-${{ matrix.part }}
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Run real X11 RECORD/XTEST end-to-end test
        if: matrix.part == 1
        run: |
          ./tools/run-gui-test.sh --noreset -- \
            bash -c 'setxkbmap -layout us,ru && GTK_A11Y=none PYTHONPATH=src python3 tests/e2e_x11.py'

      - name: Run isolated native AT-SPI context and unavailable-bus E2E
        if: matrix.part == 1
        run: ./tools/run-atspi-e2e.sh

      - name: Run real StatusNotifierItem and DBusMenu integration test
        if: matrix.part == 1
        run: dbus-run-session -- env PYTHONPATH=src python3 tests/e2e_tray_menu.py

  coverage:
    name: 100% branch coverage of both parts
    needs: [verify]
    runs-on: ubuntu-26.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install the coverage tool the parts ran
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends python3-coverage

      - name: Take every part's coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: keyswitch-coverage-part-*
          path: ${{ runner.temp }}/coverage-parts

      - name: Join the parts and require 100% branch coverage
        run: |
          python3 -m coverage combine "$RUNNER_TEMP"/coverage-parts/keyswitch-coverage-part-*/.coverage
          python3 -m coverage report

  replays:
    name: Model evidence replay (${{ matrix.replay }})
    runs-on: ubuntu-26.04
    # The context, orthotactic and boundary replays share nothing but the checkout and the
    # environment fingerprint. One after another they were the longest job whenever their
    # markers were not kept (6.5 to 9.4 minutes), so each takes a runner of its own.
    strategy:
      fail-fast: false
      matrix:
        replay: [context, ortho, boundary]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install runtime, test and package validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            at-spi2-core \
            build-essential \
            ccache \
            dbus-x11 \
            desktop-file-utils \
            file \
            gir1.2-adw-1 \
            gir1.2-atspi-2.0 \
            gir1.2-gtk-4.0 \
            hunspell-en-us \
            hunspell-ru \
            libglib2.0-bin \
            libhunspell-1.7-0 \
            libx11-6 \
            libxkbcommon0 \
            libxtst6 \
            lintian \
            onboard-data \
            patch \
            patchelf \
            python3-coverage \
            python3-dbus \
            python3-dev \
            python3-gi \
            python3-pip \
            x11-xkb-utils \
            xauth \
            xvfb

      # Replays recompute, from pinned inputs, verdicts that are a deterministic
      # function of those inputs. A marker saved after a successful replay, under a
      # key that names every input (the committed source, tools, tests and model
      # files, this workflow file, the Python, compiler, C library and dictionary
      # versions), lets an identical tree skip the recomputation.
      # Set the repository variable KEYSWITCH_CI_REPLAY_CACHE to "off" to replay
      # on every run again.
      # A tag replays every model in full and saves no marker: the evidence a
      # release publishes comes from the release run itself.
      - name: Fingerprint the replay environment
        id: inputs
        run: |
          python_version="$(python3 -c 'import sys; print(sys.version.replace(" ", "_"))')"
          packages="$(dpkg-query -W -f='${binary:Package}=${Version}\n' onboard-data hunspell-ru hunspell-en-us libhunspell-1.7-0 | tr '\n' ';')"
          # The context, boundary and prefix trainers compile tools/context_optimizer.c
          # with gcc against glibc and must reproduce their outputs byte for byte.
          toolchain="$(gcc --version | sed -n 1p);$(ldd --version | sed -n 1p)"
          echo "environment=$(printf '%s|%s|%s' "$python_version" "$packages" "$toolchain" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          # The tree is fingerprinted once, from the committed blobs: a replay leaves
          # __pycache__ and regenerated outputs behind, so hashing the working tree
          # again at save time would never produce the key the lookup asked for.
          # The workflow file is part of it, so a changed replay step replays again.
          echo "tree=$(git ls-files -s -- src/keyswitch tools tests model pyproject.toml .github/workflows/release.yml | sha256sum | cut -c1-64)" >> "$GITHUB_OUTPUT"

      - name: Look up a verified context replay of this exact tree
        id: restore_context
        if: ${{ matrix.replay == 'context' && vars.KEYSWITCH_CI_REPLAY_CACHE != 'off' && !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/replay-markers/context.ok
          key: replay-context-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.environment }}-${{ steps.inputs.outputs.tree }}
          lookup-only: true

      - name: Verify active contextual evidence and versioned replay
        if: ${{ matrix.replay == 'context' && steps.restore_context.outputs.cache-hit != 'true' }}
        run: PYTHONPATH=src python3 tools/verify_context_model.py --replay

      - name: Verify historical rejected context-v2 numeric evidence
        if: ${{ matrix.replay == 'context' && steps.restore_context.outputs.cache-hit != 'true' }}
        run: PYTHONPATH=src python3 tools/verify_context_v2.py --verify-frozen

      - name: Record the verified context replay for this tree
        if: ${{ matrix.replay == 'context' && vars.KEYSWITCH_CI_REPLAY_CACHE != 'off' && !startsWith(github.ref, 'refs/tags/') && steps.restore_context.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p "$RUNNER_TEMP/replay-markers"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/replay-markers/context.ok"

      - name: Save the verified context replay marker
        if: ${{ matrix.replay == 'context' && vars.KEYSWITCH_CI_REPLAY_CACHE != 'off' && !startsWith(github.ref, 'refs/tags/') && steps.restore_context.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/replay-markers/context.ok
          key: replay-context-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.environment }}-${{ steps.inputs.outputs.tree }}

      - name: Look up a verified ortho replay of this exact tree
        id: restore_ortho
        if: ${{ matrix.replay == 'ortho' && vars.KEYSWITCH_CI_REPLAY_CACHE != 'off' && !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/replay-markers/ortho.ok
          key: replay-ortho-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.environment }}-${{ steps.inputs.outputs.tree }}
          lookup-only: true

      - name: Replay key-space orthotactic training and promotion guard
        if: ${{ matrix.replay == 'ortho' && steps.restore_ortho.outputs.cache-hit != 'true' }}
        run: |
          PYTHONPATH=src python3 tools/ortho_corpus.py
          KEYSWITCH_MODEL_PATH=model/intent_v1/sources KEYSWITCH_HUNSPELL_PATH=model/intent_v1/sources/hunspell PYTHONPATH=src python3 tools/ortho_known.py
          PYTHONPATH=src python3 tools/ortho_web_lexicon.py
          PYTHONPATH=src python3 tools/ortho_prose_lexicon.py
          PYTHONPATH=src python3 tools/train_ortho_model.py verify
          PYTHONPATH=src:tools python3 tools/ortho_independent.py
          PYTHONPATH=src:tools python3 tools/verify_ortho_model.py
          PYTHONPATH=src python3 tools/ortho_v2_corpus.py
          KEYSWITCH_MODEL_PATH=model/intent_v1/sources PYTHONPATH=src python3 tools/ortho_v2_known.py
          KEYSWITCH_MODEL_PATH=model/intent_v1/sources PYTHONPATH=src python3 tools/ortho_v2_verified.py
          PYTHONPATH=src python3 tools/train_ortho_v2.py verify
          PYTHONPATH=src:tools python3 tools/verify_ortho_v2.py

      - name: Record the verified ortho replay for this tree
        if: ${{ matrix.replay == 'ortho' && vars.KEYSWITCH_CI_REPLAY_CACHE != 'off' && !startsWith(github.ref, 'refs/tags/') && steps.restore_ortho.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p "$RUNNER_TEMP/replay-markers"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/replay-markers/ortho.ok"

      - name: Save the verified ortho replay marker
        if: ${{ matrix.replay == 'ortho' && vars.KEYSWITCH_CI_REPLAY_CACHE != 'off' && !startsWith(github.ref, 'refs/tags/') && steps.restore_ortho.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/replay-markers/ortho.ok
          key: replay-ortho-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.environment }}-${{ steps.inputs.outputs.tree }}

      - name: Look up a verified boundary replay of this exact tree
        id: restore_boundary
        if: ${{ matrix.replay == 'boundary' && vars.KEYSWITCH_CI_REPLAY_CACHE != 'off' && !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/replay-markers/boundary.ok
          key: replay-boundary-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.environment }}-${{ steps.inputs.outputs.tree }}
          lookup-only: true

      - name: Replay boundary segmentation training and prevent rejected rollout
        if: ${{ matrix.replay == 'boundary' && steps.restore_boundary.outputs.cache-hit != 'true' }}
        run: |
          PYTHONPATH=src python3 tools/verify_boundary_model.py --verify-frozen
          PYTHONPATH=src python3 tools/evaluate_boundary_engine.py --verify

      - name: Verify frozen boundary-v2 numeric evidence and current engine gate
        if: ${{ matrix.replay == 'boundary' && steps.restore_boundary.outputs.cache-hit != 'true' }}
        run: |
          PYTHONPATH=src python3 tools/verify_boundary_v2.py --verify-frozen
          PYTHONPATH=src python3 tools/verify_boundary_v2.py

      - name: Record the verified boundary replay for this tree
        if: ${{ matrix.replay == 'boundary' && vars.KEYSWITCH_CI_REPLAY_CACHE != 'off' && !startsWith(github.ref, 'refs/tags/') && steps.restore_boundary.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p "$RUNNER_TEMP/replay-markers"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/replay-markers/boundary.ok"

      - name: Save the verified boundary replay marker
        if: ${{ matrix.replay == 'boundary' && vars.KEYSWITCH_CI_REPLAY_CACHE != 'off' && !startsWith(github.ref, 'refs/tags/') && steps.restore_boundary.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/replay-markers/boundary.ok
          key: replay-boundary-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.environment }}-${{ steps.inputs.outputs.tree }}

  prefix-replay:
    # The prefix engine replay is the longest of the replays (about nine minutes with every
    # core of a runner): it runs beside the others on a runner of its own.
    name: Prefix engine replay
    runs-on: ubuntu-26.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install runtime, test and package validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            at-spi2-core \
            build-essential \
            ccache \
            dbus-x11 \
            desktop-file-utils \
            file \
            gir1.2-adw-1 \
            gir1.2-atspi-2.0 \
            gir1.2-gtk-4.0 \
            hunspell-en-us \
            hunspell-ru \
            libglib2.0-bin \
            libhunspell-1.7-0 \
            libx11-6 \
            libxkbcommon0 \
            libxtst6 \
            lintian \
            onboard-data \
            patch \
            patchelf \
            python3-coverage \
            python3-dbus \
            python3-dev \
            python3-gi \
            python3-pip \
            x11-xkb-utils \
            xauth \
            xvfb

      # Replays recompute, from pinned inputs, verdicts that are a deterministic
      # function of those inputs. A marker saved after a successful replay, under a
      # key that names every input (the committed source, tools, tests and model
      # files, this workflow file, the Python, compiler, C library and dictionary
      # versions), lets an identical tree skip the recomputation.
      # Set the repository variable KEYSWITCH_CI_REPLAY_CACHE to "off" to replay
      # on every run again.
      # A tag replays every model in full and saves no marker: the evidence a
      # release publishes comes from the release run itself.
      - name: Fingerprint the replay environment
        id: inputs
        run: |
          python_version="$(python3 -c 'import sys; print(sys.version.replace(" ", "_"))')"
          packages="$(dpkg-query -W -f='${binary:Package}=${Version}\n' onboard-data hunspell-ru hunspell-en-us libhunspell-1.7-0 | tr '\n' ';')"
          # The context, boundary and prefix trainers compile tools/context_optimizer.c
          # with gcc against glibc and must reproduce their outputs byte for byte.
          toolchain="$(gcc --version | sed -n 1p);$(ldd --version | sed -n 1p)"
          echo "environment=$(printf '%s|%s|%s' "$python_version" "$packages" "$toolchain" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          # The tree is fingerprinted once, from the committed blobs: a replay leaves
          # __pycache__ and regenerated outputs behind, so hashing the working tree
          # again at save time would never produce the key the lookup asked for.
          # The workflow file is part of it, so a changed replay step replays again.
          echo "tree=$(git ls-files -s -- src/keyswitch tools tests model pyproject.toml .github/workflows/release.yml | sha256sum | cut -c1-64)" >> "$GITHUB_OUTPUT"

      - name: Look up a verified prefix replay of this exact tree
        id: restore_prefix
        if: ${{ vars.KEYSWITCH_CI_REPLAY_CACHE != 'off' && !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/replay-markers/prefix.ok
          key: replay-prefix-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.environment }}-${{ steps.inputs.outputs.tree }}
          lookup-only: true

      - name: Verify frozen prefix numeric evidence and current engine replay
        if: ${{ steps.restore_prefix.outputs.cache-hit != 'true' }}
        run: |
          PYTHONPATH=src python3 tools/verify_prefix_model.py --verify-frozen
          PYTHONPATH=src python3 tools/evaluate_prefix_engine.py --verify
          PYTHONPATH=src python3 tools/verify_prefix_model.py

      - name: Record the verified prefix replay for this tree
        if: ${{ vars.KEYSWITCH_CI_REPLAY_CACHE != 'off' && !startsWith(github.ref, 'refs/tags/') && steps.restore_prefix.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p "$RUNNER_TEMP/replay-markers"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/replay-markers/prefix.ok"

      - name: Save the verified prefix replay marker
        if: ${{ vars.KEYSWITCH_CI_REPLAY_CACHE != 'off' && !startsWith(github.ref, 'refs/tags/') && steps.restore_prefix.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/replay-markers/prefix.ok
          key: replay-prefix-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.environment }}-${{ steps.inputs.outputs.tree }}

  intent:
    name: Detector and intent-model quality gates
    runs-on: ubuntu-26.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install runtime, test and package validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            at-spi2-core \
            build-essential \
            ccache \
            dbus-x11 \
            desktop-file-utils \
            file \
            gir1.2-adw-1 \
            gir1.2-atspi-2.0 \
            gir1.2-gtk-4.0 \
            hunspell-en-us \
            hunspell-ru \
            libglib2.0-bin \
            libhunspell-1.7-0 \
            libx11-6 \
            libxkbcommon0 \
            libxtst6 \
            lintian \
            onboard-data \
            patch \
            patchelf \
            python3-coverage \
            python3-dbus \
            python3-dev \
            python3-gi \
            python3-pip \
            x11-xkb-utils \
            xauth \
            xvfb

      - name: Enforce detector quality gates
        run: >-
          PYTHONPATH=src tools/evaluate_detector.py
          --sample 10000 --dictionary-sample 10000 --strict

      # The release commit only moves the version, which the strict evaluation never reads
      # (tools/intent_strict_inputs.py), so the report the test workflow kept on main for the
      # same inputs, interpreter and dictionaries is taken under the test workflow's own key
      # instead of six to twelve minutes of evaluating again. It has to pass
      # tools/verify_intent_strict_report.py against this tree as a fresh one does; without
      # one (the tag pushed before main's tests kept it, or KEYSWITCH_CI_REPLAY_CACHE "off")
      # the release evaluates as before. This workflow keeps no report of its own.
      - name: Fingerprint the strict evaluation inputs
        id: intent_inputs
        run: |
          python_version="$(python3 -c 'import sys; print(sys.version.replace(" ", "_"))')"
          packages="$(dpkg-query -W -f='${binary:Package}=${Version}\n' onboard-data hunspell-ru hunspell-en-us libhunspell-1.7-0 | tr '\n' ';')"
          echo "environment=$(printf '%s|%s' "$python_version" "$packages" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "inputs=$(python3 tools/intent_strict_inputs.py)" >> "$GITHUB_OUTPUT"

      - name: Look up the strict report the test workflow kept for these inputs
        id: restore_intent
        if: ${{ vars.KEYSWITCH_CI_REPLAY_CACHE != 'off' }}
        uses: actions/cache/restore@v6
        with:
          path: build/keyswitch-intent-strict.json
          key: intent-strict-${{ runner.os }}-${{ runner.arch }}-${{ steps.intent_inputs.outputs.environment }}-${{ steps.intent_inputs.outputs.inputs }}-${{ hashFiles('.github/workflows/tests.yml') }}

      - name: Enforce linear intent-model quality gates
        if: ${{ steps.restore_intent.outputs.cache-hit != 'true' }}
        run: |
          (cd model/intent_v1/sources && sha256sum --check SHA256SUMS)
          mkdir -p build
          PYTHONPATH=src tools/evaluate_intent_model.py --strict \
            > build/keyswitch-intent-strict.json
          python3 tools/verify_intent_strict_report.py \
            --report build/keyswitch-intent-strict.json

      - name: Verify the kept strict report against this tree
        if: ${{ steps.restore_intent.outputs.cache-hit == 'true' }}
        run: |
          (cd model/intent_v1/sources && sha256sum --check SHA256SUMS)
          python3 tools/verify_intent_strict_report.py \
            --report build/keyswitch-intent-strict.json

      - name: Hand the strict report to the package job
        uses: actions/upload-artifact@v7
        with:
          name: keyswitch-intent-strict
          path: build/keyswitch-intent-strict.json
          if-no-files-found: error
          retention-days: 1

  package:
    name: Build native Debian package
    runs-on: ubuntu-26.04
    needs: [intent]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install runtime, test and package validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            at-spi2-core \
            build-essential \
            ccache \
            dbus-x11 \
            desktop-file-utils \
            file \
            gir1.2-adw-1 \
            gir1.2-atspi-2.0 \
            gir1.2-gtk-4.0 \
            hunspell-en-us \
            hunspell-ru \
            libglib2.0-bin \
            libhunspell-1.7-0 \
            libx11-6 \
            libxkbcommon0 \
            libxtst6 \
            lintian \
            onboard-data \
            patch \
            patchelf \
            python3-coverage \
            python3-dbus \
            python3-dev \
            python3-gi \
            python3-pip \
            x11-xkb-utils \
            xauth \
            xvfb

      - name: Install pinned native build tools
        run: ./tools/install-build-tools.sh "$RUNNER_TEMP/keyswitch-nuitka"

      # The report is verified against this tree before it is reused
      # (packaging/build-deb.sh runs tools/verify_intent_strict_report.py on it).
      - name: Take the strict report from the intent job
        uses: actions/download-artifact@v8
        with:
          name: keyswitch-intent-strict
          path: build

      # Nuitka keeps its compiler cache (ccache / clcache) and downloads under
      # NUITKA_CACHE_DIR; a cached object file is byte-identical to a recompiled
      # one, so the package is the same and only the C compilation is saved.
      - name: Point Nuitka at a cache that survives the job
        shell: bash
        run: echo "NUITKA_CACHE_DIR=$RUNNER_TEMP/nuitka-cache" >> "$GITHUB_ENV"

      - name: Restore the Nuitka compiler cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/nuitka-cache
          key: nuitka-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/keyswitch/**', 'packaging/**', 'tools/install-build-tools.sh') }}
          restore-keys: |
            nuitka-${{ runner.os }}-${{ runner.arch }}-

      - name: Build Debian package
        env:
          KEYSWITCH_NUITKA_ROOT: ${{ runner.temp }}/keyswitch-nuitka
          KEYSWITCH_INTENT_STRICT_REPORT: build/keyswitch-intent-strict.json
        run: ./packaging/build-deb.sh

      - name: Validate native package metadata and contents
        run: |
          package_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' pyproject.toml | head -n 1)"
          architecture="$(dpkg --print-architecture)"
          package="dist/keyswitch_${package_version}_${architecture}.deb"
          test -f "$package"
          ./tools/verify-native-deb.sh "$package"
          desktop-file-validate packaging/io.github.olegius88.KeySwitch.desktop
          lintian --fail-on error "$package"

      - name: Run packaged native executable X11 and tray E2E
        run: |
          package_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' pyproject.toml | head -n 1)"
          architecture="$(dpkg --print-architecture)"
          package="dist/keyswitch_${package_version}_${architecture}.deb"
          ./tools/run-gui-test.sh --noreset -- \
            bash -c 'setxkbmap -layout us,ru && GTK_USE_PORTAL=0 ./tools/run-native-e2e.sh "$1"' \
            _ "$package"

      - name: Upload Debian release artifact
        uses: actions/upload-artifact@v7
        with:
          name: keyswitch-release-linux
          path: dist/*.deb
          if-no-files-found: error

  windows:
    name: Win32 tests and E2E (${{ matrix.architecture }})
    # The tests and the E2E run natively on each architecture an installer is built for.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            architecture: x64
          - runner: windows-11-vs2026-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          architecture: ${{ matrix.architecture }}
          cache: pip

      - name: Install pinned typing, runtime and build dependencies
        run: |
          # pwsh reports only the last command's exit code; without this a
          # failing command earlier in the step would leave it green.
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install coverage==7.16.2 mypy==2.4.0 Nuitka==4.3 ordered-set==4.1.0 pystray==0.19.5 Pillow==12.3.0 comtypes==1.4.17
          python -m pip install --no-deps PyGObject-stubs==2.17.0
          # NumPy's stubs for the trainer's back ends, from 2.2.6 (tools/install-typing-tools.sh says why).
          # Only its .pyi files are read, so the x64 wheel serves the ARM64 runner too.
          python -m pip install --target "$env:RUNNER_TEMP\numpy-typing" --no-deps --only-binary=:all: --python-version 3.12 --platform win_amd64 numpy==2.2.6

      - name: Configure the EN and RU keyboard layouts for the E2E
        shell: powershell
        run: |
          $languages = New-WinUserLanguageList -Language "en-US"
          $languages.Add("ru-RU")
          Set-WinUserLanguageList -LanguageList $languages -Force
          $configured = Get-WinUserLanguageList
          $inputMethods = @($configured | ForEach-Object { $_.InputMethodTips })
          if (-not ($inputMethods -contains "0409:00000409") -or -not ($inputMethods -contains "0419:00000419")) {
            throw "The Windows runner did not apply the EN/RU language list"
          }

      - name: Run strict type checking and Win32 unit tests
        env:
          PYTHONPATH: src
          KEYSWITCH_MODEL_PATH: model/intent_v1/sources
        run: |
          # pwsh reports only the last command's exit code; without this a
          # failing command earlier in the step would leave it green.
          $PSNativeCommandUseErrorActionPreference = $true
          # The type check reads NumPy's stubs; the tests run without them.
          $env:PYTHONPATH = "src;$env:RUNNER_TEMP\numpy-typing"
          python -m mypy --config-file pyproject.toml --exclude "^tools/freeze_intent_development_corpus\.py$"
          python -m mypy --config-file pyproject.toml --platform linux tools/freeze_intent_development_corpus.py
          $env:PYTHONPATH = "src"
          python -m coverage erase
          python -m coverage run --branch --source=src/keyswitch tests/test_intent_model.py -v
          python -m coverage run --append --branch --source=src/keyswitch tests/test_updates.py -v
          # Every other module in a process of its own, as many at a time as there are cores
          # (tools/run_test_modules.py); the two that drive the input backends take turns.
          python tools/run_test_modules.py --serial test_windows_backend.py --serial test_input_integrity.py `
            test_windows_backend.py test_input_integrity.py test_input_sequence_matrix.py test_language_intent_regressions.py test_word_decision.py test_action_boundary.py "test_context*.py" test_boundary_model.py "test_prefix*.py" test_early_context.py test_input_delay.py `
            "--" python -m coverage run --parallel-mode --branch --source=src/keyswitch -m unittest discover -s tests -v -p
          python -m coverage combine --append --quiet
          python -m coverage report --fail-under=100 --include="*/intent_model.py,*/updates.py,*/windows_app.py,*/windows_backend.py,*/windows_instance.py,*/windows_system.py,*/windows_tray.py,*/windows_ui_model.py"

      - name: Clear the sign-in shell windows that hold the foreground
        if: ${{ matrix.architecture == 'arm64' }}
        shell: powershell
        run: |
          # The Windows 11 desktop image of the Arm runner opens a WWAHost window (the
          # host of Windows web apps) at sign-in, and behind it the search and Start
          # surfaces hold the foreground, so the E2E window could not come to the front.
          # Close the web-app host and dismiss the shell surfaces with Escape.
          Add-Type -Namespace KeySwitchCi -Name Foreground -MemberDefinition @'
          [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
          [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr window, out uint process);
          [DllImport("user32.dll")] public static extern void keybd_event(byte key, byte scan, uint flags, UIntPtr extra);
          '@
          function Get-ForegroundName {
            [uint32] $owner = 0
            [void] [KeySwitchCi.Foreground]::GetWindowThreadProcessId([KeySwitchCi.Foreground]::GetForegroundWindow(), [ref] $owner)
            (Get-Process -Id $owner -ErrorAction SilentlyContinue).ProcessName
          }
          Write-Output "Foreground before: $(Get-ForegroundName)"
          Get-Process WWAHost -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $shellSurfaces = @("WWAHost", "SearchHost", "SearchApp", "StartMenuExperienceHost", "ShellExperienceHost")
          foreach ($attempt in 1..5) {
            $name = Get-ForegroundName
            if ($shellSurfaces -notcontains $name) { break }
            [KeySwitchCi.Foreground]::keybd_event(0x1B, 0, 0, [UIntPtr]::Zero)
            [KeySwitchCi.Foreground]::keybd_event(0x1B, 0, 2, [UIntPtr]::Zero)
            Start-Sleep -Seconds 1
          }
          Write-Output "Foreground after: $(Get-ForegroundName)"

      - name: Run bidirectional WH_KEYBOARD_LL, SendInput and Tk correction E2E
        timeout-minutes: 6
        shell: pwsh
        env:
          KEYSWITCH_MODEL_PATH: model/intent_v1/sources
          PYTHONPATH: src
        run: |
          python tests/e2e_windows.py
          if ($LASTEXITCODE -ne 0) {
            # The Tk window must confirm the engine's layout switch within the engine's window;
            # a starved runner misses it once. A second failure is real.
            Write-Host "::warning::Windows E2E failed once, running it a second time"
            python tests/e2e_windows.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  windows-installer:
    name: Build native Windows installer (${{ matrix.architecture }})
    # The installer does not wait for the tests: it builds on a runner of its own beside them,
    # and nothing is published before both have passed.
    # One native build per architecture: Windows on Arm gets its own installer
    # instead of the x64 one under emulation.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            architecture: x64
          - runner: windows-11-vs2026-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          architecture: ${{ matrix.architecture }}
          cache: pip

      - name: Point Nuitka at a cache that survives the job
        shell: bash
        run: echo "NUITKA_CACHE_DIR=$RUNNER_TEMP/nuitka-cache" >> "$GITHUB_ENV"

      - name: Restore the Nuitka compiler cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/nuitka-cache
          key: nuitka-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/keyswitch/**', 'packaging/**', 'tools/install-build-tools.sh') }}
          restore-keys: |
            nuitka-${{ runner.os }}-${{ runner.arch }}-

      - name: Install pinned runtime and build dependencies
        run: |
          # pwsh reports only the last command's exit code; without this a
          # failing command earlier in the step would leave it green.
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install Nuitka==4.3 ordered-set==4.1.0 pystray==0.19.5 Pillow==12.3.0 comtypes==1.4.17

      - name: Build and self-diagnose native ZIP and Inno Setup installer
        shell: pwsh
        run: ./packaging/build-windows.ps1

      - name: Smoke-test a silent per-user installation
        # The step takes under a minute; a hung installer has held a runner for an
        # hour until GitHub lost it (0.36.2, a branch run of 04.10.2026).
        timeout-minutes: 15
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"$').Matches.Groups[1].Value
          $installer = "dist/KeySwitch-Setup-$version-${{ matrix.architecture }}.exe"
          $installRoot = Join-Path $env:RUNNER_TEMP "KeySwitch-installed"
          $install = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installRoot" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)" }
          $env:KEYSWITCH_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "KeySwitch-smoke-config"
          $env:KEYSWITCH_DATA_DIR = Join-Path $env:RUNNER_TEMP "KeySwitch-smoke-data"
          New-Item -ItemType Directory -Force $env:KEYSWITCH_CONFIG_DIR | Out-Null
          '{"general":{"autostart":false},"appearance":{"show_indicator":false},"updates":{"check_automatically":false}}' | Set-Content -Path (Join-Path $env:KEYSWITCH_CONFIG_DIR "config.json") -Encoding utf8NoBOM
          Remove-Item Env:KEYSWITCH_INTENT_MODEL_PATH -ErrorAction SilentlyContinue
          $installedExecutable = Join-Path $installRoot "KeySwitch.exe"
          $installedModel = Join-Path $installRoot "keyswitch\resources\models\layout_intent_v1.ksm"
          $sourceModel = "src/keyswitch/resources/models/layout_intent_v1.ksm"
          $intentManifest = "model/intent_v1/manifest.json"
          $diagnosticOutput = Join-Path $env:RUNNER_TEMP "KeySwitch-installed-diagnostics.json"
          $diagnosticError = Join-Path $env:RUNNER_TEMP "KeySwitch-installed-diagnostics.stderr.txt"
          $diagnosticProcess = Start-Process -FilePath $installedExecutable -ArgumentList "--diagnose" -RedirectStandardOutput $diagnosticOutput -RedirectStandardError $diagnosticError -PassThru
          if (-not $diagnosticProcess.WaitForExit(30000)) {
            $diagnosticProcess.Kill()
            $diagnosticProcess.WaitForExit()
            throw "Installed executable diagnostics timed out after 30 seconds"
          }
          if ($diagnosticProcess.ExitCode -notin @(0, 1)) { throw "Installed executable diagnostics exited with $($diagnosticProcess.ExitCode)" }
          if ((Get-Item -LiteralPath $diagnosticOutput).Length -gt 1MB) { throw "Installed executable diagnostics exceed 1 MiB" }
          if ((Get-Item -LiteralPath $intentManifest).Length -gt 1MB) { throw "Intent-model manifest exceeds 1 MiB" }
          $diagnostics = Get-Content -LiteralPath $diagnosticOutput -Raw -Encoding utf8 | ConvertFrom-Json
          $manifest = Get-Content -LiteralPath $intentManifest -Raw -Encoding utf8 | ConvertFrom-Json
          if ($diagnostics.intent_model.available -isnot [bool] -or -not $diagnostics.intent_model.available) { throw "Installed executable cannot load its bundled intent model" }
          if ($diagnostics.intent_model.checksum -cne (Get-FileHash -LiteralPath $sourceModel -Algorithm SHA256).Hash.ToLowerInvariant()) { throw "Installed executable loaded an unexpected intent-model checksum" }
          if ($diagnostics.intent_model.version -cne $manifest.artifact_model_version) { throw "Installed executable loaded an unexpected intent-model version" }
          $diagnosedModel = [System.IO.Path]::GetFullPath([string]$diagnostics.intent_model.path)
          $expectedInstalledModel = [System.IO.Path]::GetFullPath($installedModel)
          if (-not $diagnosedModel.Equals($expectedInstalledModel, [System.StringComparison]::OrdinalIgnoreCase)) { throw "Installed executable did not load its exact in-installation intent model" }
          $smoke = Start-Process -FilePath (Join-Path $installRoot "KeySwitch.exe") -ArgumentList "--smoke-ui" -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "Installed executable exited with $($smoke.ExitCode)" }
          $update = Start-Process -FilePath $installer -ArgumentList "/SP-", "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CLOSEAPPLICATIONS", "/NORESTARTAPPLICATIONS", "/KEYSWITCHUPDATE=1", "/DIR=$installRoot" -PassThru
          $update.WaitForExit()
          if ($update.ExitCode -ne 0) { throw "Auto-update installer exited with $($update.ExitCode)" }
          $keyswitchUpdatedProcess = $null
          for ($attempt = 0; $attempt -lt 40 -and -not $keyswitchUpdatedProcess; $attempt++) {
            Start-Sleep -Milliseconds 250
            $keyswitchUpdatedProcess = Get-Process -Name "KeySwitch" -ErrorAction SilentlyContinue |
              Where-Object { $_.Path -eq (Join-Path $installRoot "KeySwitch.exe") } |
              Select-Object -First 1
          }
          if (-not $keyswitchUpdatedProcess) { throw "Auto-update installer did not relaunch KeySwitch" }
          # A manual installation over the running tray application has to replace
          # files the application holds open.
          function Wait-KeySwitchMutex {
            $mutex = $null
            for ($attempt = 0; $attempt -lt 80; $attempt++) {
              if ([System.Threading.Mutex]::TryOpenExisting("Local\io.github.olegius88.KeySwitch", [ref]$mutex)) {
                $mutex.Dispose()
                return
              }
              Start-Sleep -Milliseconds 250
            }
            throw "KeySwitch did not take its single-instance mutex in 20 seconds"
          }
          Wait-KeySwitchMutex
          $reinstall = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installRoot" -PassThru
          if (-not $reinstall.WaitForExit(120000)) {
            $reinstall.Kill()
            throw "Installer over the running KeySwitch did not finish in two minutes"
          }
          if ($reinstall.ExitCode -ne 0) { throw "Installer over the running KeySwitch exited with $($reinstall.ExitCode)" }
          if (-not $keyswitchUpdatedProcess.HasExited) { throw "Installer over the running KeySwitch left it running" }
          Stop-Process -Id $keyswitchUpdatedProcess.Id -Force -ErrorAction SilentlyContinue
          Wait-Process -Id $keyswitchUpdatedProcess.Id -ErrorAction SilentlyContinue
          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          New-Item -Path $runKey -Force | Out-Null
          New-ItemProperty -Path $runKey -Name "KeySwitch" -Value (Join-Path $installRoot "KeySwitch.exe") -PropertyType String -Force | Out-Null
          $uninstaller = Get-ChildItem -Path $installRoot -Filter "unins*.exe" | Select-Object -First 1
          if (-not $uninstaller) { throw "The installed uninstaller is missing" }
          # The uninstaller removes a running application too.
          $keyswitchRunning = Start-Process -FilePath (Join-Path $installRoot "KeySwitch.exe") -ArgumentList "--hidden" -PassThru
          Wait-KeySwitchMutex
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with $($uninstall.ExitCode)" }
          if (Test-Path (Join-Path $installRoot "KeySwitch.exe")) { throw "Uninstaller left KeySwitch.exe behind" }
          if (-not $keyswitchRunning.HasExited) { throw "Uninstaller left KeySwitch running" }
          $runProperties = Get-ItemProperty -Path $runKey
          if ($runProperties.PSObject.Properties.Name -contains "KeySwitch") { throw "Uninstaller left the KeySwitch autostart value behind" }

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: keyswitch-release-windows-${{ matrix.architecture }}
          path: |
            dist/KeySwitch-Setup-*-${{ matrix.architecture }}.exe
            dist/KeySwitch-*-windows-${{ matrix.architecture }}.zip
          if-no-files-found: error

  macos:
    name: Test and build the native macOS application
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            architecture: arm64
          - runner: macos-26-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    # Read here rather than inside the step: a step cannot test its own
    # environment in its condition, and a fork has no secrets at all.
    env:
      SIGNING_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      SIGNING_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      # An App Store Connect team API key (role Developer): the .p8 text, its key ID
      # and the issuer ID. Without them the bundle stays signed but not notarized.
      NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Point Nuitka at a cache that survives the job
        shell: bash
        run: echo "NUITKA_CACHE_DIR=$RUNNER_TEMP/nuitka-cache" >> "$GITHUB_ENV"

      - name: Restore the Nuitka compiler cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/nuitka-cache
          key: nuitka-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/keyswitch/**', 'packaging/**', 'tools/install-build-tools.sh') }}
          restore-keys: |
            nuitka-${{ runner.os }}-${{ runner.arch }}-

      - name: Install pinned typing and build dependencies
        run: |
          python -m pip install coverage==7.16.2 mypy==2.4.0 Nuitka==4.3 ordered-set==4.1.0
          python -m pip install --no-deps PyGObject-stubs==2.17.0

      - name: Run strict type checking and the macOS unit tests
        env:
          PYTHONPATH: src
          KEYSWITCH_MODEL_PATH: model/intent_v1/sources
        run: |
          python -m mypy --config-file pyproject.toml \
            src/keyswitch/macos_app.py src/keyswitch/macos_backend.py \
            src/keyswitch/macos_context.py src/keyswitch/macos_native.py \
            src/keyswitch/macos_objc.py src/keyswitch/macos_services.py \
            src/keyswitch/macos_system.py src/keyswitch/macos_tray_native.py \
            src/keyswitch/desktop_ui.py src/keyswitch/desktop_services.py
          python -m coverage run --branch --source=src/keyswitch \
            -m unittest discover -s tests -p "test_macos_*.py" -v
          python -m coverage run --append --branch --source=src/keyswitch \
            -m unittest discover -s tests -p "test_tray_model.py" -v
          python -m coverage report --fail-under=100 \
            --include="*/macos_app.py,*/macos_backend.py,*/macos_context.py,*/macos_services.py,*/macos_system.py,*/tray_model.py,*/system_model.py"

      # Without the identity the bundle is built unsigned, which is fine for a
      # branch but not for what a tag publishes: an unsigned update loses its
      # Accessibility permission on every install (packaging/build-macos.sh).
      - name: Refuse to publish an unsigned application
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.SIGNING_CERTIFICATE == '' }}
        run: |
          printf 'A tagged build is published and must be signed: set %s and %s.\n' \
            MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD >&2
          exit 1

      - name: Import the Developer ID signing identity
        if: ${{ env.SIGNING_CERTIFICATE != '' }}
        run: |
          keychain_password="$(openssl rand -base64 24)"
          printf '%s' "$SIGNING_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/identity.p12"
          security create-keychain -p "$keychain_password" build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          security unlock-keychain -p "$keychain_password" build.keychain
          security import "$RUNNER_TEMP/identity.p12" -k build.keychain \
            -P "$SIGNING_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" build.keychain >/dev/null
          security list-keychains -d user -s build.keychain \
            $(security list-keychains -d user | tr -d '" ')
          rm -f "$RUNNER_TEMP/identity.p12"
          identity="$(security find-identity -v -p codesigning build.keychain \
            | sed -nE 's/.*"(Developer ID Application: .*)"/\1/p' | head -n 1)"
          test -n "$identity"
          echo "KEYSWITCH_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "KEYSWITCH_SIGN_KEYCHAIN=build.keychain" >> "$GITHUB_ENV"

      - name: Build the application bundle
        run: packaging/build-macos.sh

      - name: Run the packaged application and read its diagnostics
        run: |
          bundle="dist/macos-native/KeySwitch.app/Contents/MacOS/keyswitch-bin"
          # A runner grants no Accessibility permission, so the keyboard is
          # unavailable and the report says so; what is proven here is that the
          # bundle starts at all and finds everything it carries. Signed builds
          # have hung at this exact point before, for want of an entitlement.
          set +e
          "$bundle" --diagnose > diagnostics.json 2>&1
          status=$?
          set -e
          cat diagnostics.json
          test "$status" -eq 0 -o "$status" -eq 1
          python - <<'PYTHON'
          import json
          import pathlib

          report = json.loads(pathlib.Path("diagnostics.json").read_text(encoding="utf-8"))
          assert report["session_type"] == "quartz", report["session_type"]
          assert report["intent_model"]["available"], report["intent_model"]
          assert report["context_model"]["available"], report["context_model"]
          bundled = pathlib.Path(report["intent_model"]["path"])
          assert "KeySwitch.app" in bundled.parts, bundled
          PYTHON

      - name: Verify the signature and its entitlements
        if: ${{ env.KEYSWITCH_SIGN_IDENTITY != '' }}
        run: |
          bundle="dist/macos-native/KeySwitch.app"
          codesign --verify --strict --deep --verbose=2 "$bundle"
          codesign -d --entitlements :- "$bundle" | tee entitlements.txt
          grep -q "com.apple.security.cs.allow-unsigned-executable-memory" entitlements.txt
          codesign -dv --verbose=4 "$bundle" 2>&1 | grep -q "Timestamp="

      # Gatekeeper opens a downloaded bundle without asking only when Apple has
      # notarized it. The ticket is stapled into the bundle, and the published
      # archive is made again from the stapled bundle, since a ZIP cannot carry one.
      - name: Notarize the bundle and staple the ticket
        if: ${{ env.KEYSWITCH_SIGN_IDENTITY != '' && env.NOTARY_KEY != '' }}
        run: |
          bundle="dist/macos-native/KeySwitch.app"
          key="$RUNNER_TEMP/notary-key.p8"
          submission="$RUNNER_TEMP/KeySwitch-notarization.zip"
          trap 'rm -f "$key" "$submission"' EXIT
          printf '%s\n' "$NOTARY_KEY" > "$key"
          ditto -c -k --keepParent "$bundle" "$submission"
          xcrun notarytool submit "$submission" --key "$key" --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" --wait
          # Stapling fails when no accepted ticket exists, so a rejected
          # submission stops the job here.
          xcrun stapler staple "$bundle"
          xcrun stapler validate "$bundle"
          spctl --assess --type execute --verbose=2 "$bundle"
          archive="$(find dist -maxdepth 1 -name 'KeySwitch-*-macos-*.zip' -print -quit)"
          test -n "$archive"
          rm -f "$archive"
          ditto -c -k --keepParent "$bundle" "$archive"

      - name: Say that the published archive is not notarized
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.NOTARY_KEY == '' }}
        run: |
          printf '::warning::%s\n' "The macOS archive is signed but not notarized: set MACOS_NOTARY_KEY, MACOS_NOTARY_KEY_ID and MACOS_NOTARY_ISSUER_ID."

      - name: Upload the macOS release artifact
        uses: actions/upload-artifact@v7
        with:
          name: keyswitch-release-macos-${{ matrix.architecture }}
          path: dist/KeySwitch-*-macos-*.zip
          if-no-files-found: error

  apt-repository:
    name: Publish the signed APT repository that serves updates
    needs: [verify, coverage, replays, prefix-replay, intent, package, windows, windows-installer, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    # The published repository is what keeps an installed KeySwitch up to date,
    # and every package carries the source pointing at it, so the repository has
    # to be live before the release that hands out that package.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SIGNING_KEY: ${{ secrets.KEYSWITCH_APT_SIGNING_KEY }}
      SIGNING_PASSPHRASE: ${{ secrets.KEYSWITCH_APT_SIGNING_PASSPHRASE }}
      POOL_RELEASES: "5"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download the built Debian package
        uses: actions/download-artifact@v8
        with:
          name: keyswitch-release-linux
          path: dist

      - name: Read the GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v6

      - name: Check that Pages publishes the URL the package trusts
        run: |
          published="${{ steps.pages.outputs.base_url }}/"
          trusted="$(sed -nE 's/^URIs:[[:space:]]+([^[:space:]]+)$/\1/p' \
            packaging/debian/keyswitch.sources)"
          if [ "$published" != "$trusted" ]; then
            printf 'Pages serves %s while the package trusts %s\n' \
              "$published" "$trusted" >&2
            exit 1
          fi

      - name: Keep the previously published packages installable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' pyproject.toml | head -n 1)"
          current="keyswitch_${package_version}_amd64.deb"
          test -f "dist/$current"
          mkdir -p pool-history
          tags="$(gh release list --repo "$GITHUB_REPOSITORY" \
            --limit "$POOL_RELEASES" --json tagName --jq '.[].tagName')"
          for tag in $tags; do
            asset="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '[.assets[].name
                     | select(startswith("keyswitch_") and endswith("_amd64.deb"))]
                    | first // empty')"
            if [ -z "$asset" ] || [ "$asset" = "$current" ]; then
              continue
            fi
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern "$asset" --dir pool-history
          done
          printf 'Kept %d earlier package(s) alongside %s\n' \
            "$(find pool-history -name '*.deb' | wc -l)" "$current"

      - name: Import the repository signing key
        run: |
          if [ -z "$SIGNING_KEY" ] || [ -z "$SIGNING_PASSPHRASE" ]; then
            printf 'The repository signing secrets are missing: set %s and %s.\n' \
              KEYSWITCH_APT_SIGNING_KEY KEYSWITCH_APT_SIGNING_PASSPHRASE >&2
            exit 1
          fi
          home="$RUNNER_TEMP/keyswitch-apt-gnupg"
          install -d -m 0700 "$home"
          printf '%s' "$SIGNING_KEY" | GNUPGHOME="$home" gpg --batch --import
          printf '%s' "$SIGNING_PASSPHRASE" > "$RUNNER_TEMP/keyswitch-apt-passphrase"
          chmod 0600 "$RUNNER_TEMP/keyswitch-apt-passphrase"
          echo "GNUPGHOME=$home" >> "$GITHUB_ENV"

      - name: Build and sign the repository
        run: |
          packages=(dist/*.deb)
          for candidate in pool-history/*.deb; do
            if [ -e "$candidate" ]; then
              packages+=("$candidate")
            fi
          done
          python3 tools/apt_repository.py build site "${packages[@]}" \
            --passphrase-file "$RUNNER_TEMP/keyswitch-apt-passphrase"

      - name: Verify the repository the way an installed system reads it
        run: |
          package_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' pyproject.toml | head -n 1)"
          python3 tools/apt_repository.py verify site --expect-version "$package_version"

      - name: Upload the repository as the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy the repository to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    name: Publish GitHub Release
    needs: [verify, coverage, replays, prefix-replay, intent, package, windows, windows-installer, macos, apt-repository]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download all platform packages
        uses: actions/download-artifact@v8
        with:
          pattern: keyswitch-release-*
          path: release-assets
          merge-multiple: true

      - name: Create unified checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS

      - name: Publish or refresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' pyproject.toml | head -n 1)"
          test "$GITHUB_REF_NAME" = "v$package_version"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "KeySwitch $package_version" \
              --notes-file RELEASE_NOTES.md
          fi
